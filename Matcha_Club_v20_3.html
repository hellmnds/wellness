let draft=null, catalogQuery='',restEnd=0;

function toggleDraftDay(d){draft.days=draft.days.includes(d)?draft.days.filter(x=>x!==d):[...draft.days,d];render()}

function saveDraft(){if(!draft.name.trim())return alert('Informe o nome do treino.');if(!draft.days.length)return alert('Selecione pelo menos um dia.');if(!draft.ex.length)return alert('Selecione pelo menos um exercício.');if(draft.ex.some(e=>Number(e.sets)<1||Number(e.reps)<1||Number(e.load)<0))return alert('Confira séries, repetições e cargas.');let i=S.workouts.findIndex(w=>w.id===draft.id);draft.name=draft.name.trim();if(i<0)S.workouts.push(draft);else S.workouts[i]=draft;selected=draft.id;draft=null;update()}
function catalogMarkup(){let q=catalogQuery.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');return Object.entries(exerciseCatalog).map(([g,ns])=>{let matches=ns.filter(n=>n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(q));return matches.length?`<small>${g}</small>${matches.map(n=>`<label><input type="checkbox" ${draft.ex.some(e=>e.name.toLowerCase()===n.toLowerCase())?'checked':''} onchange="toggleCatalog(this.dataset.name,this.checked)" data-name="${esc(n)}">${esc(n)}</label>`).join('')}`:''}).join('')||'<p>Nenhum exercício encontrado. Adicione um personalizado abaixo.</p>'}
function searchCatalog(v){catalogQuery=v;$('catalog').innerHTML=catalogMarkup()}
function editorMarkup(){return `<div class="card editor" id="editor"><div class="trainhead"><h2>${S.workouts.some(w=>w.id===draft.id)?'Editar treino':'Adicionar treino'}</h2><button class="light" onclick="draft=null;render()">Cancelar</button></div><h3>1. Nome do treino</h3><input placeholder="Ex.: Glúteos e posteriores" value="${esc(draft.name)}" oninput="draft.name=this.value"><h3>2. Dias da semana</h3><div>${[1,2,3,4,5,6,0].map(d=>`<button class="day ${draft.days.includes(d)?'active':''}" onclick="toggleDraftDay(${d})">${days[d].slice(0,3)} ${draft.days.includes(d)?'✓':''}</button>`).join('')}</div><h3>3. Escolher exercícios</h3><input placeholder="Buscar exercício..." value="${esc(catalogQuery)}" oninput="searchCatalog(this.value)"><div class="catalog" id="catalog">${catalogMarkup()}</div><div class="row"><input id="customex" placeholder="Outro exercício (opcional)"><button class="light" onclick="customExercise()">Adicionar</button></div><h3>4. Séries, repetições e peso (${draft.ex.length})</h3>${draft.ex.map(e=>`<div class="draftrow"><div class="line"><b>${esc(e.name)}</b><button class="danger" onclick="draft.ex=draft.ex.filter(x=>x.id!=='${e.id}');render()">×</button></div><div class="row">${[['sets','Séries','1'],['reps','Repetições','1'],['load','Peso (kg)','0.25']].map(([k,n,step])=>`<label>${n}<input type="number" min="${k==='load'?0:1}" step="${step}" value="${esc(e[k])}" oninput="draftValue('${e.id}','${k}',this.value)"></label>`).join('')}</div></div>`).join('')||'<p>Marque os exercícios acima.</p>'}<button class="finish" onclick="saveDraft()">Salvar treino e aplicar aos dias</button></div>`}
function clockText(){let n=restEnd?Math.max(0,Math.ceil((restEnd-Date.now())/1000)):0;return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function trainingPage(){let w=workout(),l=w?log(w):null,count=w?w.ex.filter(e=>l.checks[e.id]).length:0;return `<div class="trainhead"><h2>Treinos da semana</h2><button onclick="openDraft()">＋ Adicionar treino</button></div>${draft?editorMarkup():`<p class="muted">Selecione o dia para visualizar seu treino.</p>${week()}<div class="trainlayout"><section>${w?`<div class="card hero"><small>${days[new Date(date+'T12:00:00').getDay()]}</small><h2>${esc(w.name)}</h2>${count} de ${w.ex.length} exercícios ${bar(count,w.ex.length)}${l.finished?'Treino finalizado ✓':''}</div><div class="exercisegrid">${w.ex.map(e=>`<div class="card"><div class="line"><div class="${l.checks[e.id]?'done':''}"><h3>${esc(e.name)}</h3><small>${esc(e.sets)} séries × ${esc(e.reps)} repetições</small></div><input type="checkbox" aria-label="Concluir ${esc(e.name)}" ${l.checks[e.id]?'checked':''} onchange="check('${w.id}','${e.id}',this.checked)"></div><label>Peso (kg)<input type="number" min="0" step=".25" value="${esc(l.loads[e.id]??e.load)}" onchange="load('${w.id}','${e.id}',this.value)"></label><button class="light" onclick="rest(60)">Descanso 60s</button></div>`).join('')}</div><button class="finish" onclick="finish('${w.id}')">${l.finished?'Reabrir treino':'Finalizar treino'}</button>${l.finished?'<button class="light" onclick="go(\'cardio\')">Adicionar cardio</button>':''}`:'<div class="card"><h3>Dia livre</h3><p>Nenhum treino programado para este dia.</p><button onclick="openDraft()">Adicionar treino</button></div>'}</section><aside>${w?`<div class="card"><small>CRONÔMETRO DE DESCANSO</small><div class="timerpanel"><div class="big" id="clock">${clockText()}</div><div><button class="light" onclick="rest(60)">60s</button> <button class="light" onclick="rest(90)">90s</button></div></div><button class="light" onclick="clearInterval(timer);restEnd=0;$('clock').textContent='00:00'">Parar</button></div>`:''}<div class="card"><h3>Minhas fichas</h3>${S.workouts.map(x=>`<div class="draftrow"><b>${esc(x.name)}</b><p><small>${x.days.map(d=>days[d].slice(0,3)).join(' · ')} · ${x.ex.length} exercícios</small></p><div class="trainactions"><button class="light" onclick="selected='${x.id}';render()">Ver</button><button class="light" onclick="openDraft('${x.id}')">Editar</button><button class="danger" onclick="if(selected==='${x.id}')selected='';remove('workouts','${x.id}')">Excluir</button></div></div>`).join('')||'<p>Cadastre sua primeira ficha.</p>'}</div></aside></div>`}`}

function addWater(n){S.water[date]=Math.max(0,(S.water[date]||0)+n);update()}function remove(k,id){if(confirm('Excluir este registro?')){S[k]=S[k].filter(x=>x.id!==id);update()}}function addMeal(){if(!val('food').trim())return alert('Informe o alimento.');S.meals.push({id:uid(),date,type:val('mealtype'),food:val('food'),kcal:Math.max(0,num('kcal')),p:Math.max(0,num('p')),c:Math.max(0,num('c')),g:Math.max(0,num('g'))});update()}function addPlan(){if(!val('plan').trim())return;S.plans.push({id:uid(),date,type:val('ptype'),text:val('plan')});update()}function editPlan(id){let p=S.plans.find(x=>x.id===id);let t=prompt('Editar refeição planejada',p.text);if(t!==null&&t.trim()){p.text=t.trim();update()}}function addWorkout(){if(!val('wname').trim())return alert('Informe o nome.');let w={id:uid(),name:val('wname'),days:[...document.querySelectorAll('.wd:checked')].map(e=>+e.value),ex:[]};S.workouts.push(w);selected=w.id;update()}function setWorkoutDay(id,d,on){let w=S.workouts.find(x=>x.id===id);w.days=on?[...new Set([...w.days,d])]:w.days.filter(x=>x!==d);save()}function addExercise(id){if(!val('en'+id).trim())return;S.workouts.find(w=>w.id===id).ex.push({id:uid(),name:val('en'+id),sets:val('es'+id)||'3',reps:val('er'+id)||'12',load:val('el'+id)});update()}function delExercise(id,e){S.workouts.find(w=>w.id===id).ex=S.workouts.find(w=>w.id===id).ex.filter(x=>x.id!==e);update()}function getLog(id){let k=date+'_'+id;return S.logs[k]||(S.logs[k]={checks:{},loads:{},finished:false})}function check(id,e,v){getLog(id).checks[e]=v;update()}function load(id,e,v){getLog(id).loads[e]=v;save()}function finish(id){let l=getLog(id);l.finished=!l.finished;update()}function rest(n){clearInterval(timer);restEnd=Date.now()+n*1000;const tick=()=>{if($('clock'))$('clock').textContent=clockText();if(Date.now()>=restEnd){clearInterval(timer);restEnd=0}};tick();timer=setInterval(tick,250)}function addWeight(){if(!num('weight')&&!num('waist')&&!num('hip'))return;S.weights.push({id:uid(),date,weight:num('weight'),waist:num('waist'),hip:num('hip')});update()}function photo(f){if(!f)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,800/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.photos.push({id:uid(),date,src:c.toDataURL('image/jpeg',.7)});update()};im.src=r.result};r.readAsDataURL(f)}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='wellness-backup.json';a.click();URL.revokeObjectURL(a.href)}async function restore(f){if(!f||!confirm('Substituir os registros atuais?'))return;try{let a=JSON.parse(await f.text());if(!['meals','plans','workouts','weights','photos'].every(k=>Array.isArray(a[k]))||!a.goals||!a.logs||!a.water)throw Error();S=a;update()}catch{alert('Backup inválido.')}}

const mealTypes=['Café da manhã','Almoço','Lanche','Jantar','Ceia'];let nd=null,nq='';
function nopen(id){let x=S.plans.find(x=>x.id===id);nd=x?{...JSON.parse(JSON.stringify(x)),days:[x.date||date],items:x.items||[],original:id}:{name:'',type:mealTypes[0],days:[date],items:[]};nq='';render()}

function neditor(){let start=shiftDate(date,-((new Date(date+'T12:00:00').getDay()+6)%7));return `<div class="card editor"><div class="trainhead"><h2>${nd.original?'Editar refeição':'Adicionar refeição'}</h2><button class="light" onclick="nd=null;render()">Cancelar</button></div><h3>1. Refeição e dias</h3><div class="row"><label>Tipo<select onchange="nd.type=this.value">${mealTypes.map(t=>`<option ${nd.type===t?'selected':''}>${t}</option>`).join('')}</select></label><label>Nome (opcional)<input value="${esc(nd.name||'')}" placeholder="Ex.: Café habitual" oninput="nd.name=this.value"></label></div><div>${Array.from({length:7},(_,i)=>{let d=shiftDate(start,i);return `<button class="day ${nd.days.includes(d)?'active':''}" onclick="ntoggle('${d}')">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'][i]}</button>`}).join('')}</div><h3>2. Escolher alimentos</h3><input placeholder="Buscar alimento..." value="${esc(nq)}" oninput="nq=this.value;$('ncat').innerHTML=ncat()"><div class="catalog" id="ncat">${ncat()}</div><div class="row"><input id="nc" placeholder="Outro alimento"><button class="light" onclick="ncustom()">Adicionar</button></div><h3>3. Porções</h3>${nd.items.map(x=>`<div class="draftrow"><div class="line"><b>${esc(x.name)}</b><button class="danger" onclick="nd.items=nd.items.filter(y=>y.id!=='${x.id}');render()">×</button></div><label>Quantidade (g)<input type="number" min="1" step="1" value="${esc(x.grams)}" oninput="nset('${x.id}','grams',this.value)"></label>${x.custom?`<small>Informe valores por 100 g conforme o rótulo (zero se desconhecido; total ficará incompleto).</small><div class="row">${['kcal','Proteína','Carboidratos','Gorduras'].map((n,i)=>`<label>${n}<input type="number" min="0" step=".1" value="${esc(x.values[i])}" oninput="nset('${x.id}','${i}',this.value)"></label>`).join('')}</div>`:''}</div>`).join('')||'<p>Selecione os alimentos acima.</p>'}<div class="card hero"><small>ESTIMATIVA POR REFEIÇÃO</small><p id="nsum">${nsummary(nd.items)}</p></div><small>Valores aproximados por 100 g, não validados individualmente; preparo e marca podem alterar os resultados.</small><p><button onclick="nsave()">Salvar refeição nos dias escolhidos</button></p></div>`}
function nutritionPage(t){if(nd)return neditor();let plans=S.plans.filter(x=>!x.date||x.date===date),cons=S.meals.filter(x=>x.date===date);return `<div class="trainhead"><h2>Nutrição da semana</h2><button onclick="nopen()">＋ Adicionar refeição</button></div><p class="muted">Planeje suas refeições e marque o que consumiu.</p>${week()}<div class="trainlayout"><section>${mealTypes.map(type=>{let ps=plans.filter(x=>x.type===type),ms=cons.filter(x=>x.type===type&&!x.planId);return `<div class="card"><div class="trainhead"><h3>${type}</h3><button class="light" data-type="${type}" onclick="nopen();nd.type=this.dataset.type;render()">＋</button></div>${ps.map(x=>`<div class="draftrow"><b>${esc(x.name||x.type)}</b><p class="planrow">${esc(x.text)}</p>${x.items?`<small>${nsummary(x.items)}</small><p><button class="${cons.some(m=>m.planId===x.id)?'light':''}" onclick="nconsume('${x.id}')" ${cons.some(m=>m.planId===x.id)?'disabled':''}>${cons.some(m=>m.planId===x.id)?'Consumida ✓':'Marcar como consumida'}</button></p>`:''}<div class="trainactions"><button class="light" onclick="${x.items?`nopen('${x.id}')`:`editPlan('${x.id}')`}">Editar</button><button class="danger" onclick="remove('plans','${x.id}')">Excluir</button></div></div>`).join('')}${ms.map(x=>`<div class="line"><div>${esc(x.food)}<p>${x.kcal} kcal</p></div><button class="danger" onclick="remove('meals','${x.id}')">Excluir</button></div>`).join('')||(!ps.length?'<p class="muted">Nenhuma refeição planejada.</p>':'')}</div>`}).join('')}</section><aside><div class="card hero"><small>CONSUMIDO NO DIA</small><div class="big">${Math.round(t.kcal)} kcal</div><p>P ${t.p.toFixed(1)}g · C ${t.c.toFixed(1)}g · G ${t.g.toFixed(1)}g</p>${bar(t.kcal,S.goals.kcal)}</div><div class="card"><h3>Planejado no dia</h3><p>${nsummary(plans.flatMap(x=>x.items||[]))}</p><small>Estimativas, não metas obrigatórias.</small></div><div class="card"><h3>Registros consumidos</h3>${cons.map(x=>`<div class="line"><div>${esc(x.food)}<p>${Math.round(x.kcal)} kcal</p></div><button class="danger" onclick="remove('meals','${x.id}')">Desfazer</button></div>`).join('')||'<p>Nenhum registro.</p>'}</div></aside></div>`}

const cardioTypes={'Caminhada na esteira':[2.8,3.8,5],'Corrida na esteira':[6.5,8.3,11],'Bicicleta':[3.5,6,9],'Escada':[4,6.8,9],'Elíptico':[3,5,9],'Caminhada ao ar livre':[2.8,3.5,5],'Corrida ao ar livre':[6.5,8.3,11]};
let cardioOpen=false;
Object.assign(cardioTypes,{'Natação':[4.8,6,9.8],'Hidroginástica':[3,5.5,7],'Boxe':[5.5,7.8,12.8],'Muay Thai':[5,8,10.3],'Jiu-jitsu':[4,7,10.3],'Judô':[4,7,10.3],'Karate':[4,7,10.3],'Futebol':[4,7,10],'Vôlei':[3,4,6],'Basquete':[4.5,6.5,8],'Tênis':[4,6,8],'Beach tennis':[3,5,7],'Handebol':[4,8,12],'Dança':[3,5,7.8],'Spinning':[4,7,10],'Pular corda':[8,10,12],'Remo':[3.5,6,9],'HIIT':[4,7,10],'Trilha':[3.5,5.3,7],'Outra atividade':[2.5,4,6]});
let cd={activity:Object.keys(cardioTypes)[0],intensity:1,minutes:30,weight:'',distance:'',speed:'',incline:'',active:false,elapsed:0,start:0};
function cardioRows(){return S.cardio||[]}
function cardioWeight(){return [...S.weights].filter(x=>Number(x.weight)>0&&x.date<=date).sort((a,b)=>a.date.localeCompare(b.date)).at(-1)?.weight||''}
function cardioSeconds(){return cd.elapsed+(cd.active?(Date.now()-cd.start)/1000:0)}
function cardioKcal(){let w=Number(cd.weight||cardioWeight()),m=Number(cd.minutes),met=cardioTypes[cd.activity][cd.intensity];return w>0&&m>0?Math.round(met*3.5*w/200*m):null}
function cardioRefresh(){if($('cardioEstimate'))$('cardioEstimate').textContent=cardioKcal()===null?'—':cardioKcal()+' kcal';if($('cardioClock')){let s=Math.floor(cardioSeconds());$('cardioClock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}}
function cardioToggle(){if(cd.active){cd.elapsed=cardioSeconds();cd.active=false}else{cd.start=Date.now();cd.active=true}render()}
function cardioStop(){cd.elapsed=cardioSeconds();cd.active=false;cd.minutes=Math.max(0.1,Math.round(cd.elapsed/6)/10);render()}
setInterval(()=>{if(cd.active)cardioRefresh()},500);
function cardioSave(){let w=Number(cd.weight||cardioWeight()),m=Number(cd.minutes);if(!Number.isFinite(w)||w<=0||!Number.isFinite(m)||m<=0)return alert('Informe peso e duração válidos.');if(cd.active)return alert('Finalize o cronômetro antes de salvar.');if([cd.distance,cd.speed,cd.incline].some(v=>v!==''&&(!Number.isFinite(Number(v))||Number(v)<0)))return alert('Confira os campos opcionais.');(S.cardio??=[]).push({id:uid(),date,activity:cd.activity,intensity:cd.intensity,minutes:m,weight:w,kcal:cardioKcal(),distance:cd.distance,speed:cd.speed,incline:cd.incline});cd.elapsed=0;cardioOpen=false;update()}
function cardioWeek(){let start=shiftDate(date,-((new Date(date+'T12:00:00').getDay()+6)%7));let end=shiftDate(start,6);return cardioRows().filter(x=>x.date>=start&&x.date<=end)}
function cardioSummary(){let rows=cardioWeek(),mins=rows.reduce((a,x)=>a+x.minutes,0),goal=Number(S.cardioGoal||0);return `<div class="card"><h3>Cardio da semana</h3><div class="grid"><div><small>MINUTOS</small><div class="big">${Math.round(mins*10)/10}</div></div><div><small>SESSÕES</small><div class="big">${rows.length}</div></div></div>${goal?bar(mins,goal):''}<label>Meta semanal opcional (min)<input type="number" min="0" value="${goal}" onchange="S.cardioGoal=Math.max(0,Number(this.value)||0);update()"></label><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;margin-top:18px">${Array.from({length:7},(_,i)=>{let start=shiftDate(date,-((new Date(date+'T12:00:00').getDay()+6)%7)),n=rows.filter(x=>x.date===shiftDate(start,i)).reduce((a,x)=>a+x.minutes,0),max=Math.max(1,...Array.from({length:7},(_,j)=>rows.filter(x=>x.date===shiftDate(start,j)).reduce((a,x)=>a+x.minutes,0)));return `<div style="text-align:center"><small>${Math.round(n)}</small><div style="height:${Math.max(3,n/max*90)}px;background:#a8b99d;border-radius:5px;margin:5px 0"></div><small>${['S','T','Q','Q','S','S','D'][i]}</small></div>`}).join('')}</div></div>`}
function cardioPage(){return `<div class="trainhead"><h2>Minhas atividades</h2><button onclick="cardioOpen=true;render()">＋ Adicionar atividade</button></div>${week()}<div class="trainlayout"><section>${cardioOpen?`<div class="card"><div class="trainhead"><h3>Registrar atividade</h3><button class="light" onclick="cardioOpen=false;render()">Fechar</button></div><label>Atividade<select onchange="cd.activity=this.value;cardioRefresh()">${Object.keys(cardioTypes).map(a=>`<option ${cd.activity===a?'selected':''}>${esc(a)}</option>`).join('')}</select></label><label>Intensidade<select onchange="cd.intensity=Number(this.value);cardioRefresh()">${['Leve','Moderada','Intensa'].map((x,i)=>`<option value="${i}" ${i===cd.intensity?'selected':''}>${x}</option>`).join('')}</select></label><div class="row"><label>Duração (min)<input type="number" min="0.1" step="0.1" value="${cd.minutes}" oninput="cd.minutes=this.value;cardioRefresh()"></label><label>Peso (kg)<input type="number" min="1" step="0.1" value="${esc(cd.weight||cardioWeight())}" oninput="cd.weight=this.value;cardioRefresh()"></label></div><small>Peso sugerido pelo último check-in.</small><details><summary>Dados opcionais</summary>${[['distance','Distância (km)'],['speed','Velocidade (km/h)'],['incline','Inclinação (%)']].map(([k,n])=>`<label>${n}<input type="number" min="0" step="0.1" value="${esc(cd[k])}" oninput="cd.${k}=this.value"></label>`).join('')}<small>Estes dados são apenas registros e não alteram a estimativa.</small></details><div class="card hero"><small>GASTO TOTAL ESTIMADO</small><div class="big" id="cardioEstimate">${cardioKcal()===null?'—':cardioKcal()+' kcal'}</div><small>Estimativa por MET, inclui gasto de repouso. Não descontada da alimentação.</small></div><button class="finish" onclick="cardioSave()">Salvar atividade</button></div><div class="card"><h3>Cronômetro</h3><div class="big" id="cardioClock">00:00</div><button onclick="cardioToggle()">${cd.active?'Pausar':cd.elapsed?'Retomar':'Iniciar'}</button> <button class="light" onclick="cardioStop()">Finalizar</button></div>`:`<div class="card"><h3>Movimento do dia</h3><p>${cardioRows().filter(x=>x.date===date).length} atividade(s) registrada(s) · ${Math.round(cardioRows().filter(x=>x.date===date).reduce((a,x)=>a+Number(x.minutes),0))} min</p><p class="muted">Toque em Adicionar atividade para registrar seu exercício.</p></div>`}</section><aside>${cardioSummary()}<div class="card"><h3>Histórico</h3>${[...cardioRows()].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="line"><div><b>${esc(x.activity)}</b><p>${esc(x.date)} · ${x.minutes} min · ~${x.kcal} kcal</p></div><button class="danger" onclick="remove('cardio','${x.id}')">Excluir</button></div>`).join('')||'<p>Nenhum cardio registrado.</p>'}</div></aside></div>`}

let session=null;let evoOpen=new Set();let mealPhotoDraft=null;
function persistSession(){cloudSave()}
function fmtTime(n){n=Math.max(0,Math.floor(n));return [Math.floor(n/60),n%60].map(x=>String(x).padStart(2,'0')).join(':')}
function histories(){return S.sessions||[]}
function lastExercise(n){return histories().slice().reverse().flatMap(x=>x.ex).find(x=>x.name.toLowerCase()===n.toLowerCase()&&x.sets.some(s=>s.done))}
function startSession(id){if(session){page='sessao';render();return}let w=S.workouts.find(x=>x.id===id);if(!w||!w.ex.length)return;session={id:uid(),workoutId:id,name:w.name,date:today(),start:Date.now(),idx:0,rest:60,restUntil:0,active:null,ex:w.ex.map(e=>{let prev=lastExercise(e.name)?.sets.filter(s=>s.done).at(-1);return {id:e.id,name:e.name,sets:Array.from({length:Math.max(1,Math.min(100,Number(e.sets)||1))},()=>({load:prev?.load??e.load??'',reps:e.reps,done:false,seconds:0}))}})};persistSession();page='sessao';render()}
function sessionSet(i,k,v){session.ex[session.idx].sets[i][k]=v;persistSession()}
function sessionStart(i){if(session.active!==null)return alert('Finalize a série atual.');session.restUntil=0;session.active={i,start:Date.now()};persistSession();render()}
function sessionDone(i){let s=session.ex[session.idx].sets[i];if(s.load===''||!Number.isFinite(Number(s.load))||Number(s.load)<0||!Number.isFinite(Number(s.reps))||Number(s.reps)<1)return alert('Confira peso e repetições. Use 0 para peso corporal.');s.seconds=session.active?.i===i?Math.round((Date.now()-session.active.start)/1000):0;s.done=true;session.active=null;session.restUntil=Date.now()+session.rest*1000;persistSession();render()}
function sessionMove(n){if(session.active)return alert('Finalize a série atual antes de trocar.');session.idx=n;session.restUntil=0;persistSession();render()}
function sessionTick(){if(!session)return;let now=Date.now();if($('sessionClock'))$('sessionClock').textContent=fmtTime((now-session.start)/1000);if($('setClock'))$('setClock').textContent=session.active?fmtTime((now-session.active.start)/1000):session.restUntil?fmtTime(Math.ceil((session.restUntil-now)/1000)):'00:00';if(session.restUntil&&now>=session.restUntil){session.restUntil=0;persistSession();if($('restLabel'))$('restLabel').textContent='Descanso concluído';try{navigator.vibrate?.(200)}catch{}}}

function sessionPage(){if(!session)return '<div class="card">Nenhuma sessão ativa.</div>';let a=session,e=a.ex[a.idx],done=a.ex.flatMap(x=>x.sets).filter(s=>s.done).length,total=a.ex.flatMap(x=>x.sets).length,prev=lastExercise(e.name);return `<div class="sessionwrap"><div class="card hero"><div class="trainhead"><small>SESSÃO ATIVA</small><b id="sessionClock">${fmtTime((Date.now()-a.start)/1000)}</b></div><h2>${esc(a.name)}</h2><small>Exercício ${a.idx+1} de ${a.ex.length} · ${done}/${total} séries</small>${bar(done,total)}</div><div class="card"><h2>${esc(e.name)}</h2><small>${prev?'Última sessão: '+esc(prev.sets.filter(s=>s.done).map(s=>s.load+' kg × '+s.reps).join(' · ')):'Primeiro registro deste exercício'}</small>${e.sets.map((s,i)=>`<div class="draftrow"><b>Série ${i+1} ${s.done?'✓':''}</b><div class="row"><label>Peso (kg)<input type="number" min="0" step=".25" value="${esc(s.load)}" onchange="sessionSet(${i},'load',this.value)" ${s.done?'disabled':''}></label><label>Repetições<input type="number" min="1" value="${esc(s.reps)}" onchange="sessionSet(${i},'reps',this.value)" ${s.done?'disabled':''}></label></div>${s.done?`<small>${s.seconds}s de execução</small> <button class="light" onclick="session.ex[session.idx].sets[${i}].done=false;persistSession();render()">Corrigir</button>`:a.active?.i===i?`<button onclick="sessionDone(${i})">Concluir série</button>`:`<button class="light" onclick="sessionStart(${i})" ${a.active?'disabled':''}>Iniciar série</button>`}</div>`).join('')}</div><div class="card timercompact"><small id="restLabel">${a.active?'TEMPO DA SÉRIE':'DESCANSO ENTRE SÉRIES'}</small><div class="big" id="setClock">00:00</div><div class="trainactions">${[60,90,120].map(n=>`<button class="${a.rest===n?'':'light'}" onclick="session.rest=${n};if(session.restUntil)session.restUntil=Date.now()+${n}*1000;persistSession();render()">${n}s</button>`).join('')}<button class="light" onclick="session.restUntil=0;persistSession();render()">Pular descanso</button></div></div><div class="trainactions"><button class="light" ${a.idx===0?'disabled':''} onclick="sessionMove(${a.idx-1})">Anterior</button><button ${a.idx===a.ex.length-1?'disabled':''} onclick="sessionMove(${a.idx+1})">Próximo exercício</button></div><div class="card"><label>Observações<textarea onchange="session.notes=this.value;persistSession()">${esc(a.notes||'')}</textarea></label><button onclick="endSession()">Finalizar treino</button> <button class="light" onclick="go('inicio')">Voltar ao início</button> <button class="danger" onclick="if(confirm('Descartar sessão ativa?')){session=null;persistSession();go('inicio')}">Descartar</button></div></div>`}
function endSession(){if(session.active)return alert('Finalize a série atual.');let a=session;if(!a.ex.some(e=>e.sets.some(s=>s.done)))return alert('Registre pelo menos uma série.');if(a.ex.some(e=>e.sets.some(s=>!s.done))&&!confirm('Salvar sessão com séries pendentes?'))return;a.duration=Math.round((Date.now()-a.start)/1000);S.sessions=S.sessions||[];S.sessions.push(a);S.logs[a.date+'_'+a.workoutId]={checks:Object.fromEntries(a.ex.map(e=>[e.id,e.sets.every(s=>s.done)])),loads:Object.fromEntries(a.ex.map(e=>[e.id,e.sets.filter(s=>s.done).at(-1)?.load||''])),finished:true};session=null;persistSession();save();page='resumo';render()}
function reportMarkup(a){return `<div class="card"><small>${esc(a.date)} · ${fmtTime(a.duration)}</small><h3>${esc(a.name)}</h3>${a.ex.map(e=>`<div class="line"><div><b>${esc(e.name)}</b><p>${e.sets.filter(s=>s.done).map(s=>`${esc(s.load)} kg × ${esc(s.reps)}`).join(' · ')||'Não realizado'}</p></div></div>`).join('')}<p>${esc(a.notes||'')}</p></div>`}
trainingPage=function(){if(draft)return editorMarkup();let d=new Date(date+'T12:00:00').getDay();return `<div class="trainhead"><h2>Meus treinos</h2><button onclick="openDraft()">＋ Adicionar treino</button></div><p class="muted">Organize suas fichas e dias da semana.</p>${week()}<div class="card"><h3>${days[d]}</h3>${S.workouts.filter(w=>w.days.includes(d)).map(w=>`<p>${esc(w.name)} · ${w.ex.length} exercícios</p>`).join('')||'<p>Sem treino programado.</p>'}</div><div class="fichas">${S.workouts.map(w=>`<div class="card"><h3>${esc(w.name)}</h3><small>${w.days.map(d=>days[d]).join(' · ')} · ${w.ex.length} exercícios</small><details><summary>Visualizar ficha</summary>${w.ex.map(e=>`<div class="line">${esc(e.name)}<small>${esc(e.sets)} × ${esc(e.reps)} · ${esc(e.load||'0')} kg</small></div>`).join('')}</details><div class="trainactions"><button class="light" onclick="openDraft('${w.id}')">Editar</button><button class="danger" onclick="remove('workouts','${w.id}')">Excluir</button></div></div>`).join('')}</div>`};
function mealPhotoOpen(type,planId=''){mealPhotoDraft={type,planId,date,src:'',notes:''};render()}
function mealPhotoRead(f){if(!f)return;let draft=mealPhotoDraft;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{if(mealPhotoDraft!==draft)return;let c=document.createElement('canvas'),s=Math.min(1,640/Math.max(im.width,im.height));c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);draft.src=c.toDataURL('image/jpeg',.65);render()};im.onerror=()=>alert('Formato de imagem não suportado.');im.src=r.result};r.readAsDataURL(f)}
function mealPhotoSave(){if(!mealPhotoDraft.src)return alert('Escolha uma foto.');S.mealPhotos=S.mealPhotos||[];S.mealPhotos.push({...mealPhotoDraft,id:uid(),time:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});mealPhotoDraft=null;update()}
function photoEditor(){let p=mealPhotoDraft;return `<div class="card"><div class="trainhead"><h2>Foto da refeição</h2><button class="light" onclick="mealPhotoDraft=null;render()">Cancelar</button></div><label>Refeição<select onchange="mealPhotoDraft.type=this.value;mealPhotoDraft.planId=''">${mealTypes.map(t=>`<option ${p.type===t?'selected':''}>${t}</option>`).join('')}</select></label><label>Tirar foto<input type="file" accept="image/*" capture="environment" onchange="mealPhotoRead(this.files[0])"></label><label>Escolher da galeria<input type="file" accept="image/*" onchange="mealPhotoRead(this.files[0])"></label>${p.src?`<img class="photo" src="${esc(p.src)}">`:''}<label>Observação opcional<textarea onchange="mealPhotoDraft.notes=this.value">${esc(p.notes)}</textarea></label><button onclick="mealPhotoSave()">Salvar foto</button></div>`}
let oldNutrition=nutritionPage;nutritionPage=function(t){if(mealPhotoDraft)return photoEditor();return oldNutrition(t)};

function dayWorkout19(d){return S.workouts.filter(w=>Array.isArray(w.days)&&w.days.includes(d)).at(-1)}
workout=function(){return dayWorkout19(new Date(date+'T12:00:00').getDay())};
function resolveDays19(w){const ds=w.days.slice();for(const x of S.workouts)if(x.id!==w.id)x.days=x.days.filter(d=>!ds.includes(d));}
function conflict19(ds,id){return S.workouts.some(w=>w.id!==id&&w.days.some(d=>ds.includes(d)))}
// Validate first; preserve old fichas and history by unassigning days, not deleting records.
const draftSave19=saveDraft;saveDraft=function(){if(!draft)return;let id=draft.id;if(conflict19(draft.days,id)&&!confirm('Substituir a ficha dos dias selecionados? As fichas anteriores e o histórico serão mantidos.'))return;const oldUpdate=update;update=function(){let w=S.workouts.find(x=>x.id===id);if(w)resolveDays19(w);oldUpdate()};try{draftSave19()}finally{update=oldUpdate}};
function importReplace19(fn){return function(){let o=import13;if(!o||o.kind!=='treino')return fn();let ds=o.week15?o.week15.map(b=>b.day):o.days;if(new Set(ds).size!==ds.length)return alert('Há dias repetidos na ficha. Deixe apenas um bloco por dia.');if(conflict19(ds,'')&&!confirm('Substituir as fichas dos dias importados? As anteriores ficam guardadas e o histórico é preservado.'))return;let ids=new Set(S.workouts.map(w=>w.id)),oldUpdate=update;update=function(){for(let w of S.workouts.filter(w=>!ids.has(w.id)))resolveDays19(w);oldUpdate()};try{fn()}finally{update=oldUpdate}}}
saveWeek15=importReplace19(saveWeek15);saveImport13=importReplace19(saveImport13);
function chooseFicha19(id,d){let w=S.workouts.find(x=>x.id===id);if(!w)return;if(!confirm('Usar '+w.name+' neste dia? O histórico não será alterado.'))return;for(let x of S.workouts)if(x.id!==id)x.days=x.days.filter(v=>v!==d);if(!w.days.includes(d))w.days.push(d);update()}
function training19(){let d=new Date(date+'T12:00:00').getDay(),w=dayWorkout19(d);return `<section class="train19"><div class="trainhead"><h2>Meu treino</h2></div>${week()}${w?`<section class="card dayHero19"><small>${days[d]} · FICHA DO DIA</small><h2>${esc(w.name)}</h2><p>${w.ex.length} exercícios programados</p>${w.cardio15?`<small>Cardio planejado: ${esc(w.cardio15)}</small>`:''}</section><section class="card dayList19">${w.ex.map((e,i)=>`<div class="dayEx19"><span>${String(i+1).padStart(2,'0')}</span><div><b>${esc(e.name)}</b><small>${esc(e.sets)} séries · ${esc(e.reps)} repetições${e.load!==''&&e.load!=null?' · '+esc(e.load)+' kg':''}</small></div></div>`).join('')}</section>`:'<section class="card"><h3>Dia livre</h3><p>Nenhuma ficha programada.</p></section>'}${session?'<button class="full" onclick="go(\'sessao\')">Retomar sessão</button>':w?`<button class="full" onclick="startSession('${esc(w.id)}')">Iniciar sessão</button>`:''}<details class="card manage19"><summary>Gerenciar minhas fichas</summary><div class="trainactions"><button class="light" onclick="openDraft()">Criar ficha</button><button class="light" onclick="openImport13('treino')">Importar semana</button></div>${S.workouts.map(x=>`<div class="line"><div><b>${esc(x.name)}</b><small>${x.days.map(v=>days[v]).join(' · ')||'Guardada, sem dia atribuído'}</small></div><details><summary aria-label="Opções">···</summary><button class="light" onclick="openDraft('${esc(x.id)}')">Editar</button><button class="light" onclick="chooseFicha19('${esc(x.id)}',${d})">Usar neste dia</button></details></div>`).join('')}</details></section>`}
art17=function(name){let n=norm13(name),key=/stiff|terra romeno|romanian deadlift/.test(n)?'hinge':/abdutora|abducao de quadril/.test(n)?'abductor':/sumo/.test(n)?'sumo':/bulgar/.test(n)?'split':/elevacao pelvica|hip thrust/.test(n)?'hip':/agachamento livre|agachamento sem carga/.test(n)?'squat':null;return key?`<img class="art19img" src="${art19Assets[key]}" alt="Ilustração de ${esc(name)} em duas posições">`:'<div class="noart19"><small>Ilustração ainda não disponível</small></div>'};
