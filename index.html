*{box-sizing:border-box}body{margin:0;background:#faf8f3;color:#263f32;font:600 16px system-ui,sans-serif}header,main{max-width:850px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:32px;margin:0;letter-spacing:-2px}h2{font-size:25px;margin:8px 0 16px}h3{margin:0 0 12px}small,p{font-weight:500}small{color:#627466}main{padding-bottom:110px}.card{background:white;border:1px solid #e0e5da;border-radius:22px;padding:20px;margin:12px 0}.hero{background:#365344;color:white;border:0}.hero small{color:#dce7d5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid .card{margin:0;background:#e2ebdb}.big{font-size:32px;font-weight:800}button,input,select,textarea{font:inherit;border-radius:12px;padding:12px;border:1px solid #cdd8c9;max-width:100%}input,select,textarea{width:100%;background:#fff;color:#263f32;margin:5px 0 10px}button{background:#365344;color:white;border:0;cursor:pointer}button.light{background:#e2ebdb;color:#365344}button.danger{background:#f3e4df;color:#8a453b}button:active{opacity:.75}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dae2d5;display:flex;justify-content:center;padding:8px 3px max(8px,env(safe-area-inset-bottom));z-index:10}nav button{background:white;color:#66776a;font-size:11px;flex:1;max-width:140px;padding:8px 2px}nav b{display:block;font-size:23px}nav .active{background:#e2ebdb;color:#365344}.line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid #e9ece6}.line:last-child{border:0}.line input[type=checkbox]{width:23px;height:23px;accent-color:#365344;margin:0}.bar{height:10px;border-radius:10px;background:#cbd9c5;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:#8eae80;border-radius:10px}.muted{color:#647568}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:90px}label{font-size:13px}details summary{cursor:pointer;font-weight:800} </style><header><div><small>SEU ESPAÇO DE EQUILÍBRIO</small><h1>wellness. 🌿</h1></div><button class="light" onclick="go('perfil')">⚙</button></header><main id="app"></main><nav id="nav"></nav><script>
const $=id=>document.getElementById(id),today=()=>new Date().toLocaleDateString('sv-SE'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let S;try{S=JSON.parse(localStorage.getItem('wellness-v1'))}catch{} S=S||{meals:[],plans:[],workouts:[],logs:{},water:{},weights:[],photos:[],goals:{kcal:0,protein:0,water:2000},name:''};let page='inicio',date=today(),selected='',timer=null;const days=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];function save(){try{localStorage.setItem('wellness-v1',JSON.stringify(S))}catch(e){alert('Não foi possível salvar: armazenamento cheio. Exporte seus dados.')}}function go(p){page=p;if(p==='inicio'){date=today();selected=''}render()}function update(){save();render()}function val(id){return $(id).value}function num(id){return Number(val(id))||0}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function totals(){return S.meals.filter(x=>x.date===date).reduce((a,x)=>({kcal:a.kcal+x.kcal,p:a.p+x.p,c:a.c+x.c,g:a.g+x.g}),{kcal:0,p:0,c:0,g:0})}function bar(n,d){return `<div class="bar"><i style="width:${d?Math.min(100,n/d*100):0}%"></i></div>`}function dateField(){return `<input aria-label="Data" type="date" value="${date}" onchange="date=this.value||today();selected='';render()">`}function shiftDate(dt,n){let d=new Date(dt+'T12:00:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('sv-SE')}function chooseDay(dt){date=dt;selected='';render()}function week(){let start=shiftDate(date,-((new Date(date+'T12:00:00').getDay()+6)%7));let end=shiftDate(start,6);return `<div class="weekhead"><button class="light" onclick="chooseDay(shiftDate(date,-7))">‹</button><small>${start.split('-').reverse().join('/')} a ${end.split('-').reverse().join('/')}</small><button class="light" onclick="chooseDay(shiftDate(date,7))">›</button></div><div class="week">${Array.from({length:7},(_,i)=>{let dt=shiftDate(start,i);return `<button class="${dt===date?'active':''}" onclick="chooseDay('${dt}')">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'][i]}<strong>${Number(dt.slice(-2))}</strong>${dt===today()?'Hoje':''}</button>`}).join('')}</div>`}function workout(){return S.workouts.find(w=>w.id===selected)||S.workouts.find(w=>w.days.includes(new Date(date+'T12:00:00').getDay()))}function key(w){return date+'_'+w.id}function log(w){return S.logs[key(w)]||{checks:{},loads:{},finished:false}}function render(){let t=totals(),w=workout(),water=S.water[date]||0; $('nav').innerHTML=[['inicio','⌂','Início'],['nutricao','♧','Nutrição'],['treino','▤','Treino'],['evolucao','↗','Evolução']].map(([p,i,n])=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><b>${i}</b>${n}</button>`).join('');let h='';if(page==='inicio')h=`<small>${new Date(date+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</small><h2>Olá${S.name?', '+esc(S.name):''}!</h2><div class="card hero"><small>RESUMO NUTRICIONAL</small><div class="big">${Math.round(t.kcal)} <small>kcal</small></div>${bar(t.kcal,S.goals.kcal)}<small>${S.goals.kcal?'Meta: '+S.goals.kcal+' kcal':'Meta opcional nas configurações'}</small><p>Proteínas ${t.p.toFixed(1)}g · Carboidratos ${t.c.toFixed(1)}g · Gorduras ${t.g.toFixed(1)}g</p><button class="light" onclick="go('nutricao')">Registrar refeição</button></div><div class="grid"><div class="card"><small>HIDRATAÇÃO</small><div class="big">${water} ml</div>${bar(water,S.goals.water)}<button onclick="addWater(250)">+ 250 ml</button><button class="light" onclick="addWater(-250)">−</button></div><div class="card"><small>TREINO DO DIA</small><h3>${w?esc(w.name):'Sem ficha prevista'}</h3><p>${w?(log(w).finished?'Concluído ✓':w.ex.length+' exercícios'):'Cadastre sua rotina'}</p><button onclick="go('treino')">Ver treino</button></div></div><div class="card"><h3>Seu ritmo, sua evolução</h3><p>Registre seus hábitos sem cobrança de perfeição.</p><button class="light" onclick="go('evolucao')">Acompanhar evolução</button></div>`;
if(page==='nutricao')h=`<h2>Nutrição da semana</h2><p class="muted">Selecione um dia para planejar ou registrar suas refeições.</p>${week()}<div class="card hero"><div class="big">${Math.round(t.kcal)} kcal</div><p>P ${t.p.toFixed(1)}g · C ${t.c.toFixed(1)}g · G ${t.g.toFixed(1)}g</p>${bar(t.kcal,S.goals.kcal)}</div><div class="card"><h3>Registrar alimento ou refeição</h3><select id="mealtype">${['Café da manhã','Almoço','Lanche','Jantar','Ceia'].map(x=>`<option>${x}</option>`)}</select><input id="food" placeholder="Alimento e quantidade"><div class="row"><label>Calorias<input id="kcal" type="number" min="0" placeholder="kcal"></label><label>Proteína (g)<input id="p" type="number" min="0" step=".1"></label></div><div class="row"><label>Carboidratos (g)<input id="c" type="number" min="0" step=".1"></label><label>Gorduras (g)<input id="g" type="number" min="0" step=".1"></label></div><button onclick="addMeal()">Salvar refeição</button></div>${S.meals.filter(x=>x.date===date).map(x=>`<div class="card"><small>${esc(x.type)}</small><div class="line"><div>${esc(x.food)}<p>${x.kcal} kcal · P ${x.p}g</p></div><button class="danger" onclick="remove('meals','${x.id}')">Excluir</button></div></div>`).join('')}<div class="card"><h3>Cardápio do dia</h3><small>Planeje suas refeições para a data selecionada.</small><select id="ptype">${['Café da manhã','Almoço','Lanche','Jantar','Ceia'].map(x=>`<option>${x}</option>`)}</select><textarea id="plan" placeholder="Alimentos, porções e substituições"></textarea><button onclick="addPlan()">Adicionar ao cardápio</button>${S.plans.filter(x=>!x.date||x.date===date).map(x=>`<div class="line"><div><small>${esc(x.type)}${!x.date?' · modelo antigo':''}</small><p class="planrow">${esc(x.text)}</p></div><button class="light" onclick="editPlan('${x.id}')">Editar</button><button class="danger" onclick="remove('plans','${x.id}')">×</button></div>`).join('')}<p><small>Monte refeições combinando uma fonte de proteína, vegetais, carboidratos e gorduras conforme suas preferências. Valores nutricionais são preenchidos manualmente nesta versão.</small></p></div>`;
if(page==='treino'){let l=w?log(w):null, count=w?w.ex.filter(e=>l.checks[e.id]).length:0;h=`<h2>Treinos da semana</h2><p class="muted">Escolha o dia para visualizar a ficha programada.</p>${week()}<select onchange="selected=this.value;render()"><option value="">Treino previsto para o dia</option>${S.workouts.map(x=>`<option value="${x.id}" ${selected===x.id?'selected':''}>${esc(x.name)}</option>`)}</select>${w?`<div class="card hero"><small>${days[new Date(date+'T12:00:00').getDay()]}</small><h2>${esc(w.name)}</h2>${count} de ${w.ex.length} exercícios${bar(count,w.ex.length)}${l.finished?'Treino finalizado ✓':''}</div>${w.ex.map(e=>`<div class="card"><div class="line"><div class="${l.checks[e.id]?'done':''}"><h3>${esc(e.name)}</h3><small>${esc(e.sets)} séries × ${esc(e.reps)} repetições</small></div><input aria-label="Concluir ${esc(e.name)}" type="checkbox" ${l.checks[e.id]?'checked':''} onchange="check('${w.id}','${e.id}',this.checked)"></div><label>Carga (kg)<input type="number" min="0" step=".25" value="${esc(l.loads[e.id]??e.load)}" onchange="load('${w.id}','${e.id}',this.value)"></label><button class="light" onclick="rest(60)">Descanso 60s</button></div>`).join('')}<div class="card"><div id="clock" class="big">01:00</div><button class="light" onclick="rest(90)">90s</button> <button class="light" onclick="clearInterval(timer);$('clock').textContent='00:00'">Parar</button></div><button onclick="finish('${w.id}')">${l.finished?'Reabrir treino':'Finalizar treino'}</button>`:'<div class="card">Nenhum treino selecionado.</div>'}<div class="card"><h3>Minhas fichas semanais</h3><small>Crie a ficha e marque os dias em que pretende realizá-la.</small><input id="wname" placeholder="Ex.: Treino A · Glúteos"><div>${[1,2,3,4,5,6,0].map(i=>{let d=days[i];return `<label class="day"><input style="width:auto;margin:0" type="checkbox" class="wd" value="${i}"> ${d.slice(0,3)}</label>`}).join('')}</div><button onclick="addWorkout()">Criar ficha</button>${S.workouts.map(x=>`<details class="card"><summary>${esc(x.name)} · ${x.ex.length} exercícios</summary><small>${x.days.map(d=>days[d]).join(', ')}</small><div>${[1,2,3,4,5,6,0].map(i=>`<label class="day"><input type="checkbox" style="width:auto;margin:0" ${x.days.includes(i)?'checked':''} onchange="setWorkoutDay('${x.id}',${i},this.checked)"> ${days[i].slice(0,3)}</label>`).join('')}</div>${x.ex.map(e=>`<div class="line"><div>${esc(e.name)}<small> ${esc(e.sets)}×${esc(e.reps)}</small></div><button class="danger" onclick="delExercise('${x.id}','${e.id}')">×</button></div>`).join('')}<input id="en${x.id}" placeholder="Exercício"><div class="row"><input id="es${x.id}" placeholder="Séries"><input id="er${x.id}" placeholder="Repetições"><input id="el${x.id}" placeholder="Carga kg" type="number"></div><button onclick="addExercise('${x.id}')">Adicionar exercício</button> <button class="danger" onclick="remove('workouts','${x.id}')">Excluir ficha</button></details>`).join('')}</div>`}
if(page==='agenda'){let d=new Date(date+'T12:00:00');h=`<h2>Planejamento semanal</h2>${dateField()}<div class="card">${Array.from({length:7},(_,i)=>{let a=new Date(d);a.setDate(d.getDate()-d.getDay()+i);let dt=a.toLocaleDateString('sv-SE'),ws=S.workouts.filter(w=>w.days.includes(i)),completed=Object.entries(S.logs).filter(([k,v])=>k.startsWith(dt+'_')&&v.finished).length;return `<div class="line"><div><h3>${days[i]} · ${a.getDate()}</h3><small>${ws.map(w=>esc(w.name)).join(', ')||'Descanso / livre'}${completed?' · '+completed+' concluído(s) ✓':''}</small></div><button class="light" onclick="date='${dt}';selected='';go('treino')">Ver</button></div>`}).join('')}</div><div class="card"><h3>Cardápio planejado</h3>${S.plans.map(x=>`<p><b>${esc(x.type)}:</b> ${esc(x.text)}</p>`).join('')||'<p>Nenhuma refeição planejada.</p>'}<button class="light" onclick="go('nutricao')">Editar cardápio</button></div>`}
if(page==='evolucao'){let ws=[...S.weights].sort((a,b)=>a.date.localeCompare(b.date)),pts=ws.filter(x=>x.weight>0),lo=Math.min(...pts.map(x=>x.weight))-1,hi=Math.max(...pts.map(x=>x.weight))+1;h=`<h2>Minha evolução</h2><div class="grid"><div class="card"><small>ÚLTIMO PESO</small><div class="big">${pts.at(-1)?.weight??'—'} kg</div></div><div class="card"><small>TREINOS CONCLUÍDOS</small><div class="big">${Object.values(S.logs).filter(x=>x.finished).length}</div></div></div><div class="card"><h3>Histórico de peso</h3>${pts.length>1?`<svg viewBox="0 0 320 130"><polyline fill="none" stroke="#365344" stroke-width="3" points="${pts.map((x,i)=>`${15+i*290/(pts.length-1)},${110-(x.weight-lo)/(hi-lo)*90}`).join(' ')}"/>${pts.map((x,i)=>`<circle cx="${15+i*290/(pts.length-1)}" cy="${110-(x.weight-lo)/(hi-lo)*90}" r="4" fill="#365344"/>`).join('')}</svg>`:'<p>Registre dois pesos para visualizar o gráfico.</p>'}</div><div class="card"><h3>Check-in corporal</h3>${dateField()}<div class="row"><label>Peso (kg)<input id="weight" type="number" step=".1" min="0"></label><label>Cintura (cm)<input id="waist" type="number" step=".1" min="0"></label></div><label>Quadril (cm)<input id="hip" type="number" step=".1" min="0"></label><button onclick="addWeight()">Registrar</button>${ws.reverse().map(x=>`<div class="line"><div>${esc(x.date)}<p>${x.weight||'—'} kg · cintura ${x.waist||'—'} · quadril ${x.hip||'—'}</p></div><button class="danger" onclick="remove('weights','${x.id}')">×</button></div>`).join('')}</div><div class="card"><h3>Fotos de evolução</h3><input type="file" accept="image/*" onchange="photo(this.files[0])">${S.photos.map(x=>`<p>${esc(x.date)}</p><img class="photo" src="${esc(x.src)}"><button class="danger" onclick="remove('photos','${x.id}')">Excluir</button>`).join('')}</div>`}
if(page==='perfil')h=`<h2>Configurações</h2><div class="card"><label>Nome<input id="name" value="${esc(S.name)}"></label><label>Meta calórica opcional<input id="goal" type="number" min="0" value="${S.goals.kcal}"></label><label>Meta de proteína (g)<input id="prot" type="number" min="0" value="${S.goals.protein}"></label><label>Meta de água (ml)<input id="watergoal" type="number" min="0" value="${S.goals.water}"></label><button onclick="S.name=val('name');S.goals={kcal:num('goal'),protein:num('prot'),water:num('watergoal')};update()">Salvar configurações</button></div><div class="card"><h3>Seus dados</h3><p>Os registros ficam neste navegador. Faça backup regularmente. Não há sincronização nem login.</p><button onclick="backup()">Exportar backup</button><p>Restaurar backup (substitui registros atuais)</p><input type="file" accept="application/json" onchange="restore(this.files[0])"></div>`;$('app').innerHTML=h;if(['nutricao','treino','evolucao'].includes(page)){let cards=[...$('app').children].filter(x=>x.classList.contains('card'));if(cards.length>1){let wrap=document.createElement('div');wrap.className='sectiongrid';cards[0].before(wrap);for(let el of cards)wrap.append(el)}}}
function addWater(n){S.water[date]=Math.max(0,(S.water[date]||0)+n);update()}function remove(k,id){if(confirm('Excluir este registro?')){S[k]=S[k].filter(x=>x.id!==id);update()}}function addMeal(){if(!val('food').trim())return alert('Informe o alimento.');S.meals.push({id:uid(),date,type:val('mealtype'),food:val('food'),kcal:Math.max(0,num('kcal')),p:Math.max(0,num('p')),c:Math.max(0,num('c')),g:Math.max(0,num('g'))});update()}function addPlan(){if(!val('plan').trim())return;S.plans.push({id:uid(),date,type:val('ptype'),text:val('plan')});update()}function editPlan(id){let p=S.plans.find(x=>x.id===id);let t=prompt('Editar refeição planejada',p.text);if(t!==null&&t.trim()){p.text=t.trim();update()}}function addWorkout(){if(!val('wname').trim())return alert('Informe o nome.');let w={id:uid(),name:val('wname'),days:[...document.querySelectorAll('.wd:checked')].map(e=>+e.value),ex:[]};S.workouts.push(w);selected=w.id;update()}function setWorkoutDay(id,d,on){let w=S.workouts.find(x=>x.id===id);w.days=on?[...new Set([...w.days,d])]:w.days.filter(x=>x!==d);save()}function addExercise(id){if(!val('en'+id).trim())return;S.workouts.find(w=>w.id===id).ex.push({id:uid(),name:val('en'+id),sets:val('es'+id)||'3',reps:val('er'+id)||'12',load:val('el'+id)});update()}function delExercise(id,e){S.workouts.find(w=>w.id===id).ex=S.workouts.find(w=>w.id===id).ex.filter(x=>x.id!==e);update()}function getLog(id){let k=date+'_'+id;return S.logs[k]||(S.logs[k]={checks:{},loads:{},finished:false})}function check(id,e,v){getLog(id).checks[e]=v;update()}function load(id,e,v){getLog(id).loads[e]=v;save()}function finish(id){let l=getLog(id);l.finished=!l.finished;update()}function rest(n){clearInterval(timer);const tick=()=>{if(!$('clock'))return clearInterval(timer);$('clock').textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');if(n--<=0)clearInterval(timer)};tick();timer=setInterval(tick,1000)}function addWeight(){if(!num('weight')&&!num('waist')&&!num('hip'))return;S.weights.push({id:uid(),date,weight:num('weight'),waist:num('waist'),hip:num('hip')});update()}function photo(f){if(!f)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,800/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.photos.push({id:uid(),date,src:c.toDataURL('image/jpeg',.7)});update()};im.src=r.result};r.readAsDataURL(f)}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='wellness-backup.json';a.click();URL.revokeObjectURL(a.href)}async function restore(f){if(!f||!confirm('Substituir os registros atuais?'))return;try{let a=JSON.parse(await f.text());if(!['meals','plans','workouts','weights','photos'].every(k=>Array.isArray(a[k]))||!a.goals||!a.logs||!a.water)throw Error();S=a;update()}catch{alert('Backup inválido.')}}render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></html>
