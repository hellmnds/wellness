*{box-sizing:border-box}body{margin:0;background:#faf8f3;color:#263f32;font:600 16px system-ui,sans-serif}header,main{max-width:850px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:32px;margin:0;letter-spacing:-2px}h2{font-size:25px;margin:8px 0 16px}h3{margin:0 0 12px}small,p{font-weight:500}small{color:#627466}main{padding-bottom:110px}.card{background:white;border:1px solid #e0e5da;border-radius:22px;padding:20px;margin:12px 0}.hero{background:#365344;color:white;border:0}.hero small{color:#dce7d5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid .card{margin:0;background:#e2ebdb}.big{font-size:32px;font-weight:800}button,input,select,textarea{font:inherit;border-radius:12px;padding:12px;border:1px solid #cdd8c9;max-width:100%}input,select,textarea{width:100%;background:#fff;color:#263f32;margin:5px 0 10px}button{background:#365344;color:white;border:0;cursor:pointer}button.light{background:#e2ebdb;color:#365344}button.danger{background:#f3e4df;color:#8a453b}button:active{opacity:.75}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dae2d5;display:flex;justify-content:center;padding:8px 3px max(8px,env(safe-area-inset-bottom));z-index:10}nav button{background:white;color:#66776a;font-size:11px;flex:1;max-width:140px;padding:8px 2px}nav b{display:block;font-size:23px}nav .active{background:#e2ebdb;color:#365344}.line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid #e9ece6}.line:last-child{border:0}.line input[type=checkbox]{width:23px;height:23px;accent-color:#365344;margin:0}.bar{height:10px;border-radius:10px;background:#cbd9c5;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:#8eae80;border-radius:10px}.muted{color:#647568}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:90px}label{font-size:13px}details summary{cursor:pointer;font-weight:800} .pill{background:#e8d8c4;padding:6px 10px;border-radius:20px;font-size:12px;color:#4b5242}.day{display:inline-block;padding:8px;margin:3px;border-radius:12px;background:#e2ebdb}.done{text-decoration:line-through;opacity:.6}img.photo{width:100%;max-height:260px;object-fit:contain;border-radius:12px}svg{max-width:100%}
header,main{max-width:none;margin:0;padding:24px 32px}main{padding-bottom:110px}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:12px 0 20px}.week button{background:#e2ebdb;color:#365344;padding:10px 2px;min-width:0;font-size:12px}.week button strong{display:block;font-size:20px}.week button.active{background:#365344;color:white}.weekhead{display:flex;align-items:center;justify-content:space-between;gap:8px}.weekhead button{padding:8px 14px}.weekhead small{text-align:center}.sectiongrid{display:grid;gap:16px}.hero{min-height:150px}.grid .card{min-width:0}.big{overflow-wrap:anywhere}.day input{accent-color:#365344}.planrow{white-space:pre-wrap;overflow-wrap:anywhere} @media(min-width:850px){body{padding-left:235px}header{padding:30px 40px 10px}main{padding:20px 40px 40px}nav{top:0;bottom:0;right:auto;width:235px;flex-direction:column;justify-content:flex-start;gap:12px;padding:35px 16px;background:#365344;border:0}nav:before{content:'wellness.';color:white;font-size:32px;font-weight:850;padding:0 12px 28px}nav button{flex:none;max-width:none;text-align:left;color:#e2ebdb;background:transparent;font-size:16px;padding:14px;display:flex;align-items:center;gap:12px}nav b{font-size:24px}nav .active{background:#e2ebdb;color:#365344}.sectiongrid{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}.sectiongrid>.card{margin:0}.week button{font-size:15px}.week button strong{font-size:24px}}@media(max-width:849px){header,main{padding:16px}main{padding-bottom:110px}nav button{max-width:none}.grid .big{font-size:25px}.card{padding:16px}.week button{font-size:11px}.week button strong{font-size:17px}}

.trainhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.trainhead h2{margin:0}.trainlayout{display:grid;gap:18px;align-items:start}.trainlayout .card{margin:0 0 12px}.exercisegrid{display:grid;gap:12px}.exercisegrid .card{margin:0}.trainlayout aside{min-width:0}.trainlayout section{min-width:0}.catalog{max-height:310px;overflow:auto;border:1px solid #dae2d5;border-radius:14px;padding:8px}.catalog label{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #e9ece6;font-size:15px}.catalog input,.day input{width:auto;margin:0;accent-color:#365344}.draftrow{padding:12px 0;border-bottom:1px solid #e9ece6}.draftrow .row>*{min-width:65px}.trainactions{display:flex;gap:8px;flex-wrap:wrap}.trainactions button{flex:1}.trainlayout .hero{min-height:0}.timerpanel{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.timerpanel .big{font-variant-numeric:tabular-nums}.day.active{background:#365344;color:white}.trainlayout .exercisegrid .card{background:#fff}.trainlayout .exercisegrid h3{text-transform:capitalize}.trainlayout input[type=number]{font-size:16px}.trainlayout .line{border:0}.trainlayout .finish{width:100%;margin-top:12px}.editor{border:1px solid #cdd8c9}.editor h3{margin-top:16px}@media(min-width:1000px){.trainlayout{grid-template-columns:minmax(0,2fr) minmax(260px,1fr)}.exercisegrid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:500px){.trainhead button{width:100%}.draftrow .row{gap:5px}}
.sessionwrap{max-width:900px;margin:auto}.fichas{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}.fichas .card{margin:0}.fichas details{margin:16px 0}.compactevo{max-width:950px}.compactevo details>summary{padding:5px;cursor:pointer}.compactevo svg{max-height:160px}.mealpic{margin-top:10px}.mealpic summary{display:flex;align-items:center;gap:12px;font-size:13px}.mealpic summary img{width:64px;height:64px;object-fit:cover;border-radius:10px}.timercompact{position:sticky;bottom:80px;z-index:2;box-shadow:0 4px 20px #36534422}button:disabled{opacity:.45;cursor:default}@media(min-width:850px){.timercompact{bottom:10px}}</style><header><div><small>SEU ESPAÇO DE EQUILÍBRIO</small><h1>wellness. 🌿</h1></div><button class="light" onclick="go('perfil')">⚙</button></header><main id="app"></main><nav id="nav"></nav><script>
const $=id=>document.getElementById(id),today=()=>new Date().toLocaleDateString('sv-SE'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let S;try{S=JSON.parse(localStorage.getItem('wellness-v1'))}catch{} S=S||{meals:[],plans:[],workouts:[],logs:{},water:{},weights:[],photos:[],goals:{kcal:0,protein:0,water:2000},name:''};let page='inicio',date=today(),selected='',timer=null;const days=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];function save(){try{localStorage.setItem('wellness-v1',JSON.stringify(S))}catch(e){alert('Não foi possível salvar: armazenamento cheio. Exporte seus dados.')}}function go(p){page=p;if(p==='inicio'){date=today();selected=''}render()}function update(){save();render()}function val(id){return $(id).value}function num(id){return Number(val(id))||0}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function totals(){return S.meals.filter(x=>x.date===date).reduce((a,x)=>({kcal:a.kcal+x.kcal,p:a.p+x.p,c:a.c+x.c,g:a.g+x.g}),{kcal:0,p:0,c:0,g:0})}function bar(n,d){return `<div class="bar"><i style="width:${d?Math.min(100,n/d*100):0}%"></i></div>`}function dateField(){return `<input aria-label="Data" type="date" value="${date}" onchange="date=this.value||today();selected='';render()">`}function shiftDate(dt,n){let d=new Date(dt+'T12:00:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('sv-SE')}function chooseDay(dt){date=dt;selected='';render()}function week(){let start=shiftDate(date,-((new Date(date+'T12:00:00').getDay()+6)%7));let end=shiftDate(start,6);return `<div class="weekhead"><button class="light" onclick="chooseDay(shiftDate(date,-7))">‹</button><small>${start.split('-').reverse().join('/')} a ${end.split('-').reverse().join('/')}</small><button class="light" onclick="chooseDay(shiftDate(date,7))">›</button></div><div class="week">${Array.from({length:7},(_,i)=>{let dt=shiftDate(start,i);return `<button class="${dt===date?'active':''}" onclick="chooseDay('${dt}')">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'][i]}<strong>${Number(dt.slice(-2))}</strong>${dt===today()?'Hoje':''}</button>`}).join('')}</div>`}function workout(){return S.workouts.find(w=>w.id===selected)||S.workouts.find(w=>w.days.includes(new Date(date+'T12:00:00').getDay()))}function key(w){return date+'_'+w.id}function log(w){return S.logs[key(w)]||{checks:{},loads:{},finished:false}}function render(){let t=totals(),w=workout(),water=S.water[date]||0; $('nav').innerHTML=[['inicio','⌂','Início'],['nutricao','♧','Nutrição'],['treino','▤','Treino'],['cardio','♥','Cardio'],['evolucao','↗','Evolução']].map(([p,i,n])=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><b>${i}</b>${n}</button>`).join('');let h='';if(page==='inicio')h=`<small>${new Date(date+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</small><h2>Olá${S.name?', '+esc(S.name):''}!</h2><div class="card hero"><small>RESUMO NUTRICIONAL</small><div class="big">${Math.round(t.kcal)} <small>kcal</small></div>${bar(t.kcal,S.goals.kcal)}<small>${S.goals.kcal?'Meta: '+S.goals.kcal+' kcal':'Meta opcional nas configurações'}</small><p>Proteínas ${t.p.toFixed(1)}g · Carboidratos ${t.c.toFixed(1)}g · Gorduras ${t.g.toFixed(1)}g</p><button class="light" onclick="go('nutricao')">Registrar refeição</button></div><div class="grid"><div class="card"><small>HIDRATAÇÃO</small><div class="big">${water} ml</div>${bar(water,S.goals.water)}<button onclick="addWater(250)">+ 250 ml</button><button class="light" onclick="addWater(-250)">−</button></div><div class="card"><small>TREINO DO DIA</small><h3>${w?esc(w.name):'Sem ficha prevista'}</h3><p>${w?(log(w).finished?'Concluído ✓':w.ex.length+' exercícios'):'Cadastre sua rotina'}</p><button onclick="go('treino')">Ver treino</button></div></div><div class="card"><h3>Seu ritmo, sua evolução</h3><p>Registre seus hábitos sem cobrança de perfeição.</p><button class="light" onclick="go('evolucao')">Acompanhar evolução</button></div>`;
if(page==='nutricao')h=nutritionPage(t);
if(page==='treino')h=trainingPage();
if(page==='cardio')h=cardioPage();
if(page==='agenda'){let d=new Date(date+'T12:00:00');h=`<h2>Planejamento semanal</h2>${dateField()}<div class="card">${Array.from({length:7},(_,i)=>{let a=new Date(d);a.setDate(d.getDate()-d.getDay()+i);let dt=a.toLocaleDateString('sv-SE'),ws=S.workouts.filter(w=>w.days.includes(i)),completed=Object.entries(S.logs).filter(([k,v])=>k.startsWith(dt+'_')&&v.finished).length;return `<div class="line"><div><h3>${days[i]} · ${a.getDate()}</h3><small>${ws.map(w=>esc(w.name)).join(', ')||'Descanso / livre'}${completed?' · '+completed+' concluído(s) ✓':''}</small></div><button class="light" onclick="date='${dt}';selected='';go('treino')">Ver</button></div>`}).join('')}</div><div class="card"><h3>Cardápio planejado</h3>${S.plans.map(x=>`<p><b>${esc(x.type)}:</b> ${esc(x.text)}</p>`).join('')||'<p>Nenhuma refeição planejada.</p>'}<button class="light" onclick="go('nutricao')">Editar cardápio</button></div>`}
if(page==='evolucao'){let ws=[...S.weights].sort((a,b)=>a.date.localeCompare(b.date)),pts=ws.filter(x=>x.weight>0),lo=Math.min(...pts.map(x=>x.weight))-1,hi=Math.max(...pts.map(x=>x.weight))+1;h=`<h2>Minha evolução</h2><div class="grid"><div class="card"><small>ÚLTIMO PESO</small><div class="big">${pts.at(-1)?.weight??'—'} kg</div></div><div class="card"><small>TREINOS CONCLUÍDOS</small><div class="big">${Object.values(S.logs).filter(x=>x.finished).length}</div></div></div><div class="card"><h3>Histórico de peso</h3>${pts.length>1?`<svg viewBox="0 0 320 130"><polyline fill="none" stroke="#365344" stroke-width="3" points="${pts.map((x,i)=>`${15+i*290/(pts.length-1)},${110-(x.weight-lo)/(hi-lo)*90}`).join(' ')}"/>${pts.map((x,i)=>`<circle cx="${15+i*290/(pts.length-1)}" cy="${110-(x.weight-lo)/(hi-lo)*90}" r="4" fill="#365344"/>`).join('')}</svg>`:'<p>Registre dois pesos para visualizar o gráfico.</p>'}</div><div class="card"><h3>Check-in corporal</h3>${dateField()}<div class="row"><label>Peso (kg)<input id="weight" type="number" step=".1" min="0"></label><label>Cintura (cm)<input id="waist" type="number" step=".1" min="0"></label></div><label>Quadril (cm)<input id="hip" type="number" step=".1" min="0"></label><button onclick="addWeight()">Registrar</button>${ws.reverse().map(x=>`<div class="line"><div>${esc(x.date)}<p>${x.weight||'—'} kg · cintura ${x.waist||'—'} · quadril ${x.hip||'—'}</p></div><button class="danger" onclick="remove('weights','${x.id}')">×</button></div>`).join('')}</div><div class="card"><h3>Fotos de evolução</h3><input type="file" accept="image/*" onchange="photo(this.files[0])">${S.photos.map(x=>`<p>${esc(x.date)}</p><img class="photo" src="${esc(x.src)}"><button class="danger" onclick="remove('photos','${x.id}')">Excluir</button>`).join('')}</div>`}
if(page==='perfil')h=`<h2>Configurações</h2><div class="card"><label>Nome<input id="name" value="${esc(S.name)}"></label><label>Meta calórica opcional<input id="goal" type="number" min="0" value="${S.goals.kcal}"></label><label>Meta de proteína (g)<input id="prot" type="number" min="0" value="${S.goals.protein}"></label><label>Meta de água (ml)<input id="watergoal" type="number" min="0" value="${S.goals.water}"></label><button onclick="S.name=val('name');S.goals={kcal:num('goal'),protein:num('prot'),water:num('watergoal')};update()">Salvar configurações</button></div><div class="card"><h3>Seus dados</h3><p>Os registros ficam neste navegador. Faça backup regularmente. Não há sincronização nem login.</p><button onclick="backup()">Exportar backup</button><p>Restaurar backup (substitui registros atuais)</p><input type="file" accept="application/json" onchange="restore(this.files[0])"></div>`;if(page==='evolucao')h+=cardioSummary();if(page==='inicio')h+=`<div class="card"><h3>Cardio de hoje</h3><p>${cardioRows().filter(x=>x.date===date).reduce((a,x)=>a+x.minutes,0)} min registrados</p><button onclick="go('cardio')">Adicionar cardio</button></div>`;$('app').innerHTML=h;if(page==='cardio')cardioRefresh();if(['nutricao','evolucao'].includes(page)){let cards=[...$('app').children].filter(x=>x.classList.contains('card'));if(cards.length>1){let wrap=document.createElement('div');wrap.className='sectiongrid';cards[0].before(wrap);for(let el of cards)wrap.append(el)}}}

const exerciseCatalog={"Glúteos e posteriores":["Elevação pélvica","Stiff","Mesa flexora","Cadeira flexora","Cadeira abdutora","Abdução na polia","Glúteo na polia","Agachamento búlgaro","Levantamento terra romeno","Coice na máquina"],"Quadríceps e pernas":["Agachamento livre","Agachamento no Smith","Leg press 45°","Leg press horizontal","Cadeira extensora","Hack squat","Afundo","Passada","Cadeira adutora","Panturrilha em pé","Panturrilha sentada"],"Costas e bíceps":["Puxada frontal","Remada baixa","Remada curvada","Remada unilateral","Pulldown","Rosca direta","Rosca alternada","Rosca martelo"],"Peito, ombros e tríceps":["Supino reto","Supino inclinado","Crucifixo","Peck deck","Desenvolvimento","Elevação lateral","Elevação frontal","Tríceps corda","Tríceps testa","Tríceps na polia"],"Abdômen e cardio":["Prancha","Abdominal supra","Abdominal infra","Abdominal na máquina","Esteira","Bicicleta","Elíptico","Escada"]};
let draft=null, catalogQuery='',restEnd=0;
function openDraft(id){let w=S.workouts.find(x=>x.id===id);draft=w?JSON.parse(JSON.stringify(w)):{id:uid(),name:'',days:[],ex:[]};catalogQuery='';render();document.getElementById('editor')?.scrollIntoView({behavior:'smooth',block:'start'})}
function toggleDraftDay(d){draft.days=draft.days.includes(d)?draft.days.filter(x=>x!==d):[...draft.days,d];render()}
function toggleCatalog(name,on){let e=draft.ex.find(x=>x.name.toLowerCase()===name.toLowerCase());if(on&&!e)draft.ex.push({id:uid(),name,sets:'3',reps:'12',load:''});if(!on&&e)draft.ex=draft.ex.filter(x=>x.id!==e.id);render()}
function customExercise(){let n=val('customex').trim();if(n)toggleCatalog(n,true)}
function draftValue(id,k,v){let e=draft.ex.find(x=>x.id===id);if(e)e[k]=v}
function saveDraft(){if(!draft.name.trim())return alert('Informe o nome do treino.');if(!draft.days.length)return alert('Selecione pelo menos um dia.');if(!draft.ex.length)return alert('Selecione pelo menos um exercício.');if(draft.ex.some(e=>Number(e.sets)<1||Number(e.reps)<1||Number(e.load)<0))return alert('Confira séries, repetições e cargas.');let i=S.workouts.findIndex(w=>w.id===draft.id);draft.name=draft.name.trim();if(i<0)S.workouts.push(draft);else S.workouts[i]=draft;selected=draft.id;draft=null;update()}
function catalogMarkup(){let q=catalogQuery.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');return Object.entries(exerciseCatalog).map(([g,ns])=>{let matches=ns.filter(n=>n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(q));return matches.length?`<small>${g}</small>${matches.map(n=>`<label><input type="checkbox" ${draft.ex.some(e=>e.name.toLowerCase()===n.toLowerCase())?'checked':''} onchange="toggleCatalog(this.dataset.name,this.checked)" data-name="${esc(n)}">${esc(n)}</label>`).join('')}`:''}).join('')||'<p>Nenhum exercício encontrado. Adicione um personalizado abaixo.</p>'}
function searchCatalog(v){catalogQuery=v;$('catalog').innerHTML=catalogMarkup()}
function editorMarkup(){return `<div class="card editor" id="editor"><div class="trainhead"><h2>${S.workouts.some(w=>w.id===draft.id)?'Editar treino':'Adicionar treino'}</h2><button class="light" onclick="draft=null;render()">Cancelar</button></div><h3>1. Nome do treino</h3><input placeholder="Ex.: Glúteos e posteriores" value="${esc(draft.name)}" oninput="draft.name=this.value"><h3>2. Dias da semana</h3><div>${[1,2,3,4,5,6,0].map(d=>`<button class="day ${draft.days.includes(d)?'active':''}" onclick="toggleDraftDay(${d})">${days[d].slice(0,3)} ${draft.days.includes(d)?'✓':''}</button>`).join('')}</div><h3>3. Escolher exercícios</h3><input placeholder="Buscar exercício..." value="${esc(catalogQuery)}" oninput="searchCatalog(this.value)"><div class="catalog" id="catalog">${catalogMarkup()}</div><div class="row"><input id="customex" placeholder="Outro exercício (opcional)"><button class="light" onclick="customExercise()">Adicionar</button></div><h3>4. Séries, repetições e peso (${draft.ex.length})</h3>${draft.ex.map(e=>`<div class="draftrow"><div class="line"><b>${esc(e.name)}</b><button class="danger" onclick="draft.ex=draft.ex.filter(x=>x.id!=='${e.id}');render()">×</button></div><div class="row">${[['sets','Séries','1'],['reps','Repetições','1'],['load','Peso (kg)','0.25']].map(([k,n,step])=>`<label>${n}<input type="number" min="${k==='load'?0:1}" step="${step}" value="${esc(e[k])}" oninput="draftValue('${e.id}','${k}',this.value)"></label>`).join('')}</div></div>`).join('')||'<p>Marque os exercícios acima.</p>'}<button class="finish" onclick="saveDraft()">Salvar treino e aplicar aos dias</button></div>`}
function clockText(){let n=restEnd?Math.max(0,Math.ceil((restEnd-Date.now())/1000)):0;return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function trainingPage(){let w=workout(),l=w?log(w):null,count=w?w.ex.filter(e=>l.checks[e.id]).length:0;return `<div class="trainhead"><h2>Treinos da semana</h2><button onclick="openDraft()">＋ Adicionar treino</button></div>${draft?editorMarkup():`<p class="muted">Selecione o dia para visualizar seu treino.</p>${week()}<div class="trainlayout"><section>${w?`<div class="card hero"><small>${days[new Date(date+'T12:00:00').getDay()]}</small><h2>${esc(w.name)}</h2>${count} de ${w.ex.length} exercícios ${bar(count,w.ex.length)}${l.finished?'Treino finalizado ✓':''}</div><div class="exercisegrid">${w.ex.map(e=>`<div class="card"><div class="line"><div class="${l.checks[e.id]?'done':''}"><h3>${esc(e.name)}</h3><small>${esc(e.sets)} séries × ${esc(e.reps)} repetições</small></div><input type="checkbox" aria-label="Concluir ${esc(e.name)}" ${l.checks[e.id]?'checked':''} onchange="check('${w.id}','${e.id}',this.checked)"></div><label>Peso (kg)<input type="number" min="0" step=".25" value="${esc(l.loads[e.id]??e.load)}" onchange="load('${w.id}','${e.id}',this.value)"></label><button class="light" onclick="rest(60)">Descanso 60s</button></div>`).join('')}</div><button class="finish" onclick="finish('${w.id}')">${l.finished?'Reabrir treino':'Finalizar treino'}</button>${l.finished?'<button class="light" onclick="go(\'cardio\')">Adicionar cardio</button>':''}`:'<div class="card"><h3>Dia livre</h3><p>Nenhum treino programado para este dia.</p><button onclick="openDraft()">Adicionar treino</button></div>'}</section><aside>${w?`<div class="card"><small>CRONÔMETRO DE DESCANSO</small><div class="timerpanel"><div class="big" id="clock">${clockText()}</div><div><button class="light" onclick="rest(60)">60s</button> <button class="light" onclick="rest(90)">90s</button></div></div><button class="light" onclick="clearInterval(timer);restEnd=0;$('clock').textContent='00:00'">Parar</button></div>`:''}<div class="card"><h3>Minhas fichas</h3>${S.workouts.map(x=>`<div class="draftrow"><b>${esc(x.name)}</b><p><small>${x.days.map(d=>days[d].slice(0,3)).join(' · ')} · ${x.ex.length} exercícios</small></p><div class="trainactions"><button class="light" onclick="selected='${x.id}';render()">Ver</button><button class="light" onclick="openDraft('${x.id}')">Editar</button><button class="danger" onclick="if(selected==='${x.id}')selected='';remove('workouts','${x.id}')">Excluir</button></div></div>`).join('')||'<p>Cadastre sua primeira ficha.</p>'}</div></aside></div>`}`}

function addWater(n){S.water[date]=Math.max(0,(S.water[date]||0)+n);update()}function remove(k,id){if(confirm('Excluir este registro?')){S[k]=S[k].filter(x=>x.id!==id);update()}}function addMeal(){if(!val('food').trim())return alert('Informe o alimento.');S.meals.push({id:uid(),date,type:val('mealtype'),food:val('food'),kcal:Math.max(0,num('kcal')),p:Math.max(0,num('p')),c:Math.max(0,num('c')),g:Math.max(0,num('g'))});update()}function addPlan(){if(!val('plan').trim())return;S.plans.push({id:uid(),date,type:val('ptype'),text:val('plan')});update()}function editPlan(id){let p=S.plans.find(x=>x.id===id);let t=prompt('Editar refeição planejada',p.text);if(t!==null&&t.trim()){p.text=t.trim();update()}}function addWorkout(){if(!val('wname').trim())return alert('Informe o nome.');let w={id:uid(),name:val('wname'),days:[...document.querySelectorAll('.wd:checked')].map(e=>+e.value),ex:[]};S.workouts.push(w);selected=w.id;update()}function setWorkoutDay(id,d,on){let w=S.workouts.find(x=>x.id===id);w.days=on?[...new Set([...w.days,d])]:w.days.filter(x=>x!==d);save()}function addExercise(id){if(!val('en'+id).trim())return;S.workouts.find(w=>w.id===id).ex.push({id:uid(),name:val('en'+id),sets:val('es'+id)||'3',reps:val('er'+id)||'12',load:val('el'+id)});update()}function delExercise(id,e){S.workouts.find(w=>w.id===id).ex=S.workouts.find(w=>w.id===id).ex.filter(x=>x.id!==e);update()}function getLog(id){let k=date+'_'+id;return S.logs[k]||(S.logs[k]={checks:{},loads:{},finished:false})}function check(id,e,v){getLog(id).checks[e]=v;update()}function load(id,e,v){getLog(id).loads[e]=v;save()}function finish(id){let l=getLog(id);l.finished=!l.finished;update()}function rest(n){clearInterval(timer);restEnd=Date.now()+n*1000;const tick=()=>{if($('clock'))$('clock').textContent=clockText();if(Date.now()>=restEnd){clearInterval(timer);restEnd=0}};tick();timer=setInterval(tick,250)}function addWeight(){if(!num('weight')&&!num('waist')&&!num('hip'))return;S.weights.push({id:uid(),date,weight:num('weight'),waist:num('waist'),hip:num('hip')});update()}function photo(f){if(!f)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,800/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.photos.push({id:uid(),date,src:c.toDataURL('image/jpeg',.7)});update()};im.src=r.result};r.readAsDataURL(f)}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='wellness-backup.json';a.click();URL.revokeObjectURL(a.href)}async function restore(f){if(!f||!confirm('Substituir os registros atuais?'))return;try{let a=JSON.parse(await f.text());if(!['meals','plans','workouts','weights','photos'].every(k=>Array.isArray(a[k]))||!a.goals||!a.logs||!a.water)throw Error();S=a;update()}catch{alert('Backup inválido.')}}
const foods={'Cereais e tubérculos':{'Arroz branco cozido':[128,2.5,28,0.2],'Feijão carioca cozido':[76,4.8,13.6,0.5],'Batata inglesa cozida':[52,1.2,11.9,0],'Batata-doce cozida':[77,0.6,18.4,0.1],'Aveia em flocos':[394,13.9,66.6,8.5],'Pão francês':[300,8,58.6,3.1],'Macarrão cozido':[157,5.8,30.9,0.9]},'Proteínas':{'Peito de frango grelhado':[159,32,0,2.5],'Ovo cozido':[146,13.3,0.6,9.5],'Patinho grelhado':[219,35.9,0,7.3],'Tilápia grelhada':[128,26,0,2.7],'Atum em água':[116,25.5,0,0.8]},'Frutas e vegetais':{'Banana prata':[98,1.3,26,0.1],'Maçã':[56,0.3,15.2,0],'Mamão':[45,0.8,11.6,0.1],'Morango':[30,0.9,6.8,0.3],'Brócolis cozido':[25,2.1,4.4,0.5],'Alface':[11,1.3,1.7,0.2],'Tomate':[15,1.1,3.1,0.2]},'Laticínios e outros':{'Leite integral':[61,3.2,4.7,3.3],'Iogurte natural':[51,4.1,1.9,3],'Queijo minas frescal':[264,17.4,3.2,20.2],'Azeite':[884,0,0,100],'Pasta de amendoim':[588,25,20,50]}};
const mealTypes=['Café da manhã','Almoço','Lanche','Jantar','Ceia'];let nd=null,nq='';
function nopen(id){let x=S.plans.find(x=>x.id===id);nd=x?{...JSON.parse(JSON.stringify(x)),days:[x.date||date],items:x.items||[],original:id}:{name:'',type:mealTypes[0],days:[date],items:[]};nq='';render()}
function ntoggle(d){nd.days=nd.days.includes(d)?nd.days.filter(x=>x!==d):[...nd.days,d];render()}
function nfood(n){let f=Object.values(foods).find(g=>g[n])?.[n];if(!f)return;if(nd.items.some(x=>x.name===n))nd.items=nd.items.filter(x=>x.name!==n);else nd.items.push({id:uid(),name:n,grams:100,values:f});render()}
function ncat(){let norm=x=>x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');return Object.entries(foods).map(([g,items])=>{let ns=Object.keys(items).filter(n=>norm(n).includes(norm(nq)));return ns.length?`<small>${g}</small>${ns.map(n=>`<label><input type="checkbox" data-name="${esc(n)}" ${nd.items.some(x=>x.name===n)?'checked':''} onchange="nfood(this.dataset.name)">${esc(n)}</label>`).join('')}`:''}).join('')||'<p>Nenhum alimento encontrado.</p>'}
function nsum(items){return items.reduce((a,x)=>a.map((v,i)=>v+Number(x.grams||0)*Number(x.values[i]||0)/100),[0,0,0,0])}
function nsummary(items){let [k,p,c,g]=nsum(items);return `${Math.round(k)} kcal · P ${p.toFixed(1)} g · C ${c.toFixed(1)} g · G ${g.toFixed(1)} g`}
function ncustom(){let n=val('nc').trim();if(!n)return;nd.items.push({id:uid(),name:n,grams:100,values:[0,0,0,0],custom:true});render()}
function nset(id,k,v){let x=nd.items.find(x=>x.id===id);if(k==='grams')x.grams=v;else x.values[Number(k)]=v;$('nsum').textContent=nsummary(nd.items)}
function nsave(){if(!nd.days.length||!nd.items.length)return alert('Escolha dias e alimentos.');if(nd.items.some(x=>!(Number(x.grams)>0)||x.values.some(v=>!Number.isFinite(Number(v))||Number(v)<0)))return alert('Confira as quantidades e valores.');if(nd.original)S.plans=S.plans.filter(x=>x.id!==nd.original);let group=uid();nd.days.forEach(d=>S.plans.push({id:uid(),group,date:d,type:nd.type,name:nd.name.trim(),items:JSON.parse(JSON.stringify(nd.items)),text:nd.items.map(x=>x.name+' · '+x.grams+' g').join('\n')}));nd=null;update()}
function nconsume(id){let x=S.plans.find(x=>x.id===id);if(!x||!x.items)return;if(S.meals.some(m=>m.planId===id))return;let [kcal,p,c,g]=nsum(x.items);S.meals.push({id:uid(),planId:id,date:x.date,type:x.type,food:x.name||x.text,kcal,p,c,g});update()}
function neditor(){let start=shiftDate(date,-((new Date(date+'T12:00:00').getDay()+6)%7));return `<div class="card editor"><div class="trainhead"><h2>${nd.original?'Editar refeição':'Adicionar refeição'}</h2><button class="light" onclick="nd=null;render()">Cancelar</button></div><h3>1. Refeição e dias</h3><div class="row"><label>Tipo<select onchange="nd.type=this.value">${mealTypes.map(t=>`<option ${nd.type===t?'selected':''}>${t}</option>`).join('')}</select></label><label>Nome (opcional)<input value="${esc(nd.name||'')}" placeholder="Ex.: Café habitual" oninput="nd.name=this.value"></label></div><div>${Array.from({length:7},(_,i)=>{let d=shiftDate(start,i);return `<button class="day ${nd.days.includes(d)?'active':''}" onclick="ntoggle('${d}')">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'][i]}</button>`}).join('')}</div><h3>2. Escolher alimentos</h3><input placeholder="Buscar alimento..." value="${esc(nq)}" oninput="nq=this.value;$('ncat').innerHTML=ncat()"><div class="catalog" id="ncat">${ncat()}</div><div class="row"><input id="nc" placeholder="Outro alimento"><button class="light" onclick="ncustom()">Adicionar</button></div><h3>3. Porções</h3>${nd.items.map(x=>`<div class="draftrow"><div class="line"><b>${esc(x.name)}</b><button class="danger" onclick="nd.items=nd.items.filter(y=>y.id!=='${x.id}');render()">×</button></div><label>Quantidade (g)<input type="number" min="1" step="1" value="${esc(x.grams)}" oninput="nset('${x.id}','grams',this.value)"></label>${x.custom?`<small>Informe valores por 100 g conforme o rótulo (zero se desconhecido; total ficará incompleto).</small><div class="row">${['kcal','Proteína','Carboidratos','Gorduras'].map((n,i)=>`<label>${n}<input type="number" min="0" step=".1" value="${esc(x.values[i])}" oninput="nset('${x.id}','${i}',this.value)"></label>`).join('')}</div>`:''}</div>`).join('')||'<p>Selecione os alimentos acima.</p>'}<div class="card hero"><small>ESTIMATIVA POR REFEIÇÃO</small><p id="nsum">${nsummary(nd.items)}</p></div><small>Valores aproximados por 100 g, não validados individualmente; preparo e marca podem alterar os resultados.</small><p><button onclick="nsave()">Salvar refeição nos dias escolhidos</button></p></div>`}
function nutritionPage(t){if(nd)return neditor();let plans=S.plans.filter(x=>!x.date||x.date===date),cons=S.meals.filter(x=>x.date===date);return `<div class="trainhead"><h2>Nutrição da semana</h2><button onclick="nopen()">＋ Adicionar refeição</button></div><p class="muted">Planeje suas refeições e marque o que consumiu.</p>${week()}<div class="trainlayout"><section>${mealTypes.map(type=>{let ps=plans.filter(x=>x.type===type),ms=cons.filter(x=>x.type===type&&!x.planId);return `<div class="card"><div class="trainhead"><h3>${type}</h3><button class="light" data-type="${type}" onclick="nopen();nd.type=this.dataset.type;render()">＋</button></div>${ps.map(x=>`<div class="draftrow"><b>${esc(x.name||x.type)}</b><p class="planrow">${esc(x.text)}</p>${x.items?`<small>${nsummary(x.items)}</small><p><button class="${cons.some(m=>m.planId===x.id)?'light':''}" onclick="nconsume('${x.id}')" ${cons.some(m=>m.planId===x.id)?'disabled':''}>${cons.some(m=>m.planId===x.id)?'Consumida ✓':'Marcar como consumida'}</button></p>`:''}<div class="trainactions"><button class="light" onclick="${x.items?`nopen('${x.id}')`:`editPlan('${x.id}')`}">Editar</button><button class="danger" onclick="remove('plans','${x.id}')">Excluir</button></div></div>`).join('')}${ms.map(x=>`<div class="line"><div>${esc(x.food)}<p>${x.kcal} kcal</p></div><button class="danger" onclick="remove('meals','${x.id}')">Excluir</button></div>`).join('')||(!ps.length?'<p class="muted">Nenhuma refeição planejada.</p>':'')}</div>`}).join('')}</section><aside><div class="card hero"><small>CONSUMIDO NO DIA</small><div class="big">${Math.round(t.kcal)} kcal</div><p>P ${t.p.toFixed(1)}g · C ${t.c.toFixed(1)}g · G ${t.g.toFixed(1)}g</p>${bar(t.kcal,S.goals.kcal)}</div><div class="card"><h3>Planejado no dia</h3><p>${nsummary(plans.flatMap(x=>x.items||[]))}</p><small>Estimativas, não metas obrigatórias.</small></div><div class="card"><h3>Registros consumidos</h3>${cons.map(x=>`<div class="line"><div>${esc(x.food)}<p>${Math.round(x.kcal)} kcal</p></div><button class="danger" onclick="remove('meals','${x.id}')">Desfazer</button></div>`).join('')||'<p>Nenhum registro.</p>'}</div></aside></div>`}

const cardioTypes={'Caminhada na esteira':[2.8,3.8,5],'Corrida na esteira':[6.5,8.3,11],'Bicicleta':[3.5,6,9],'Escada':[4,6.8,9],'Elíptico':[3,5,9],'Caminhada ao ar livre':[2.8,3.5,5],'Corrida ao ar livre':[6.5,8.3,11]};
let cd={activity:Object.keys(cardioTypes)[0],intensity:1,minutes:30,weight:'',distance:'',speed:'',incline:'',active:false,elapsed:0,start:0};
function cardioRows(){return S.cardio||[]}
function cardioWeight(){return [...S.weights].filter(x=>Number(x.weight)>0&&x.date<=date).sort((a,b)=>a.date.localeCompare(b.date)).at(-1)?.weight||''}
function cardioSeconds(){return cd.elapsed+(cd.active?(Date.now()-cd.start)/1000:0)}
function cardioKcal(){let w=Number(cd.weight||cardioWeight()),m=Number(cd.minutes),met=cardioTypes[cd.activity][cd.intensity];return w>0&&m>0?Math.round(met*3.5*w/200*m):null}
function cardioRefresh(){if($('cardioEstimate'))$('cardioEstimate').textContent=cardioKcal()===null?'—':cardioKcal()+' kcal';if($('cardioClock')){let s=Math.floor(cardioSeconds());$('cardioClock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}}
function cardioToggle(){if(cd.active){cd.elapsed=cardioSeconds();cd.active=false}else{cd.start=Date.now();cd.active=true}render()}
function cardioStop(){cd.elapsed=cardioSeconds();cd.active=false;cd.minutes=Math.max(0.1,Math.round(cd.elapsed/6)/10);render()}
setInterval(()=>{if(cd.active)cardioRefresh()},500);
function cardioSave(){let w=Number(cd.weight||cardioWeight()),m=Number(cd.minutes);if(!Number.isFinite(w)||w<=0||!Number.isFinite(m)||m<=0)return alert('Informe peso e duração válidos.');if(cd.active)return alert('Finalize o cronômetro antes de salvar.');if([cd.distance,cd.speed,cd.incline].some(v=>v!==''&&(!Number.isFinite(Number(v))||Number(v)<0)))return alert('Confira os campos opcionais.');(S.cardio??=[]).push({id:uid(),date,activity:cd.activity,intensity:cd.intensity,minutes:m,weight:w,kcal:cardioKcal(),distance:cd.distance,speed:cd.speed,incline:cd.incline});cd.elapsed=0;update()}
function cardioWeek(){let start=shiftDate(date,-((new Date(date+'T12:00:00').getDay()+6)%7));let end=shiftDate(start,6);return cardioRows().filter(x=>x.date>=start&&x.date<=end)}
function cardioSummary(){let rows=cardioWeek(),mins=rows.reduce((a,x)=>a+x.minutes,0),goal=Number(S.cardioGoal||0);return `<div class="card"><h3>Cardio da semana</h3><div class="grid"><div><small>MINUTOS</small><div class="big">${Math.round(mins*10)/10}</div></div><div><small>SESSÕES</small><div class="big">${rows.length}</div></div></div>${goal?bar(mins,goal):''}<label>Meta semanal opcional (min)<input type="number" min="0" value="${goal}" onchange="S.cardioGoal=Math.max(0,Number(this.value)||0);update()"></label><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;margin-top:18px">${Array.from({length:7},(_,i)=>{let start=shiftDate(date,-((new Date(date+'T12:00:00').getDay()+6)%7)),n=rows.filter(x=>x.date===shiftDate(start,i)).reduce((a,x)=>a+x.minutes,0),max=Math.max(1,...Array.from({length:7},(_,j)=>rows.filter(x=>x.date===shiftDate(start,j)).reduce((a,x)=>a+x.minutes,0)));return `<div style="text-align:center"><small>${Math.round(n)}</small><div style="height:${Math.max(3,n/max*90)}px;background:#a8b99d;border-radius:5px;margin:5px 0"></div><small>${['S','T','Q','Q','S','S','D'][i]}</small></div>`}).join('')}</div></div>`}
function cardioPage(){return `<h2>Meu cardio</h2>${week()}<div class="trainlayout"><section><div class="card"><h3>Registrar atividade</h3><div class="grid">${Object.keys(cardioTypes).map(a=>`<button class="${cd.activity===a?'':'light'}" onclick="cd.activity='${a}';render()">${a}</button>`).join('')}</div><label>Intensidade<select onchange="cd.intensity=Number(this.value);cardioRefresh()">${['Leve','Moderada','Intensa'].map((x,i)=>`<option value="${i}" ${i===cd.intensity?'selected':''}>${x}</option>`).join('')}</select></label><div class="row"><label>Duração (min)<input type="number" min="0.1" step="0.1" value="${cd.minutes}" oninput="cd.minutes=this.value;cardioRefresh()"></label><label>Peso (kg)<input type="number" min="1" step="0.1" value="${esc(cd.weight||cardioWeight())}" oninput="cd.weight=this.value;cardioRefresh()"></label></div><small>Peso sugerido pelo último check-in.</small><details><summary>Dados opcionais</summary>${[['distance','Distância (km)'],['speed','Velocidade (km/h)'],['incline','Inclinação (%)']].map(([k,n])=>`<label>${n}<input type="number" min="0" step="0.1" value="${esc(cd[k])}" oninput="cd.${k}=this.value"></label>`).join('')}<small>Estes dados são apenas registros e não alteram a estimativa.</small></details><div class="card hero"><small>GASTO TOTAL ESTIMADO</small><div class="big" id="cardioEstimate">${cardioKcal()===null?'—':cardioKcal()+' kcal'}</div><small>Estimativa por MET, inclui gasto de repouso. Não descontada da alimentação.</small></div><button class="finish" onclick="cardioSave()">Salvar cardio</button></div></section><aside><div class="card"><h3>Cronômetro</h3><div class="big" id="cardioClock">00:00</div><button onclick="cardioToggle()">${cd.active?'Pausar':cd.elapsed?'Retomar':'Iniciar'}</button> <button class="light" onclick="cardioStop()">Finalizar</button></div>${cardioSummary()}<div class="card"><h3>Histórico</h3>${[...cardioRows()].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="line"><div><b>${esc(x.activity)}</b><p>${esc(x.date)} · ${x.minutes} min · ~${x.kcal} kcal</p></div><button class="danger" onclick="remove('cardio','${x.id}')">Excluir</button></div>`).join('')||'<p>Nenhum cardio registrado.</p>'}</div></aside></div>`}

let session=null;try{session=JSON.parse(localStorage.getItem('wellness-active-v6'))}catch{};let evoOpen=new Set();let mealPhotoDraft=null;
function persistSession(){try{localStorage.setItem('wellness-active-v6',JSON.stringify(session))}catch{alert('Não foi possível salvar a sessão.')}}
function fmtTime(n){n=Math.max(0,Math.floor(n));return [Math.floor(n/60),n%60].map(x=>String(x).padStart(2,'0')).join(':')}
function histories(){return S.sessions||[]}
function lastExercise(n){return histories().slice().reverse().flatMap(x=>x.ex).find(x=>x.name.toLowerCase()===n.toLowerCase()&&x.sets.some(s=>s.done))}
function startSession(id){if(session){page='sessao';render();return}let w=S.workouts.find(x=>x.id===id);if(!w||!w.ex.length)return;session={id:uid(),workoutId:id,name:w.name,date:today(),start:Date.now(),idx:0,rest:60,restUntil:0,active:null,ex:w.ex.map(e=>{let prev=lastExercise(e.name)?.sets.filter(s=>s.done).at(-1);return {id:e.id,name:e.name,sets:Array.from({length:Math.max(1,Math.min(100,Number(e.sets)||1))},()=>({load:prev?.load??e.load??'',reps:e.reps,done:false,seconds:0}))}})};persistSession();page='sessao';render()}
function sessionSet(i,k,v){session.ex[session.idx].sets[i][k]=v;persistSession()}
function sessionStart(i){if(session.active!==null)return alert('Finalize a série atual.');session.restUntil=0;session.active={i,start:Date.now()};persistSession();render()}
function sessionDone(i){let s=session.ex[session.idx].sets[i];if(s.load===''||!Number.isFinite(Number(s.load))||Number(s.load)<0||!Number.isFinite(Number(s.reps))||Number(s.reps)<1)return alert('Confira peso e repetições. Use 0 para peso corporal.');s.seconds=session.active?.i===i?Math.round((Date.now()-session.active.start)/1000):0;s.done=true;session.active=null;session.restUntil=Date.now()+session.rest*1000;persistSession();render()}
function sessionMove(n){if(session.active)return alert('Finalize a série atual antes de trocar.');session.idx=n;session.restUntil=0;persistSession();render()}
function sessionTick(){if(!session)return;let now=Date.now();if($('sessionClock'))$('sessionClock').textContent=fmtTime((now-session.start)/1000);if($('setClock'))$('setClock').textContent=session.active?fmtTime((now-session.active.start)/1000):session.restUntil?fmtTime(Math.ceil((session.restUntil-now)/1000)):'00:00';if(session.restUntil&&now>=session.restUntil){session.restUntil=0;persistSession();if($('restLabel'))$('restLabel').textContent='Descanso concluído';try{navigator.vibrate?.(200)}catch{}}}
setInterval(sessionTick,250);
function sessionPage(){if(!session)return '<div class="card">Nenhuma sessão ativa.</div>';let a=session,e=a.ex[a.idx],done=a.ex.flatMap(x=>x.sets).filter(s=>s.done).length,total=a.ex.flatMap(x=>x.sets).length,prev=lastExercise(e.name);return `<div class="sessionwrap"><div class="card hero"><div class="trainhead"><small>SESSÃO ATIVA</small><b id="sessionClock">${fmtTime((Date.now()-a.start)/1000)}</b></div><h2>${esc(a.name)}</h2><small>Exercício ${a.idx+1} de ${a.ex.length} · ${done}/${total} séries</small>${bar(done,total)}</div><div class="card"><h2>${esc(e.name)}</h2><small>${prev?'Última sessão: '+esc(prev.sets.filter(s=>s.done).map(s=>s.load+' kg × '+s.reps).join(' · ')):'Primeiro registro deste exercício'}</small>${e.sets.map((s,i)=>`<div class="draftrow"><b>Série ${i+1} ${s.done?'✓':''}</b><div class="row"><label>Peso (kg)<input type="number" min="0" step=".25" value="${esc(s.load)}" onchange="sessionSet(${i},'load',this.value)" ${s.done?'disabled':''}></label><label>Repetições<input type="number" min="1" value="${esc(s.reps)}" onchange="sessionSet(${i},'reps',this.value)" ${s.done?'disabled':''}></label></div>${s.done?`<small>${s.seconds}s de execução</small> <button class="light" onclick="session.ex[session.idx].sets[${i}].done=false;persistSession();render()">Corrigir</button>`:a.active?.i===i?`<button onclick="sessionDone(${i})">Concluir série</button>`:`<button class="light" onclick="sessionStart(${i})" ${a.active?'disabled':''}>Iniciar série</button>`}</div>`).join('')}</div><div class="card timercompact"><small id="restLabel">${a.active?'TEMPO DA SÉRIE':'DESCANSO ENTRE SÉRIES'}</small><div class="big" id="setClock">00:00</div><div class="trainactions">${[60,90,120].map(n=>`<button class="${a.rest===n?'':'light'}" onclick="session.rest=${n};if(session.restUntil)session.restUntil=Date.now()+${n}*1000;persistSession();render()">${n}s</button>`).join('')}<button class="light" onclick="session.restUntil=0;persistSession();render()">Pular descanso</button></div></div><div class="trainactions"><button class="light" ${a.idx===0?'disabled':''} onclick="sessionMove(${a.idx-1})">Anterior</button><button ${a.idx===a.ex.length-1?'disabled':''} onclick="sessionMove(${a.idx+1})">Próximo exercício</button></div><div class="card"><label>Observações<textarea onchange="session.notes=this.value;persistSession()">${esc(a.notes||'')}</textarea></label><button onclick="endSession()">Finalizar treino</button> <button class="light" onclick="go('inicio')">Voltar ao início</button> <button class="danger" onclick="if(confirm('Descartar sessão ativa?')){session=null;persistSession();go('inicio')}">Descartar</button></div></div>`}
function endSession(){if(session.active)return alert('Finalize a série atual.');let a=session;if(!a.ex.some(e=>e.sets.some(s=>s.done)))return alert('Registre pelo menos uma série.');if(a.ex.some(e=>e.sets.some(s=>!s.done))&&!confirm('Salvar sessão com séries pendentes?'))return;a.duration=Math.round((Date.now()-a.start)/1000);S.sessions=S.sessions||[];S.sessions.push(a);S.logs[a.date+'_'+a.workoutId]={checks:Object.fromEntries(a.ex.map(e=>[e.id,e.sets.every(s=>s.done)])),loads:Object.fromEntries(a.ex.map(e=>[e.id,e.sets.filter(s=>s.done).at(-1)?.load||''])),finished:true};session=null;persistSession();save();page='resumo';render()}
function reportMarkup(a){return `<div class="card"><small>${esc(a.date)} · ${fmtTime(a.duration)}</small><h3>${esc(a.name)}</h3>${a.ex.map(e=>`<div class="line"><div><b>${esc(e.name)}</b><p>${e.sets.filter(s=>s.done).map(s=>`${esc(s.load)} kg × ${esc(s.reps)}`).join(' · ')||'Não realizado'}</p></div></div>`).join('')}<p>${esc(a.notes||'')}</p></div>`}
trainingPage=function(){if(draft)return editorMarkup();let d=new Date(date+'T12:00:00').getDay();return `<div class="trainhead"><h2>Meus treinos</h2><button onclick="openDraft()">＋ Adicionar treino</button></div><p class="muted">Organize suas fichas e dias da semana.</p>${week()}<div class="card"><h3>${days[d]}</h3>${S.workouts.filter(w=>w.days.includes(d)).map(w=>`<p>${esc(w.name)} · ${w.ex.length} exercícios</p>`).join('')||'<p>Sem treino programado.</p>'}</div><div class="fichas">${S.workouts.map(w=>`<div class="card"><h3>${esc(w.name)}</h3><small>${w.days.map(d=>days[d]).join(' · ')} · ${w.ex.length} exercícios</small><details><summary>Visualizar ficha</summary>${w.ex.map(e=>`<div class="line">${esc(e.name)}<small>${esc(e.sets)} × ${esc(e.reps)} · ${esc(e.load||'0')} kg</small></div>`).join('')}</details><div class="trainactions"><button class="light" onclick="openDraft('${w.id}')">Editar</button><button class="danger" onclick="remove('workouts','${w.id}')">Excluir</button></div></div>`).join('')}</div>`};
function mealPhotoOpen(type,planId=''){mealPhotoDraft={type,planId,date,src:'',notes:''};render()}
function mealPhotoRead(f){if(!f)return;let draft=mealPhotoDraft;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{if(mealPhotoDraft!==draft)return;let c=document.createElement('canvas'),s=Math.min(1,640/Math.max(im.width,im.height));c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);draft.src=c.toDataURL('image/jpeg',.65);render()};im.onerror=()=>alert('Formato de imagem não suportado.');im.src=r.result};r.readAsDataURL(f)}
function mealPhotoSave(){if(!mealPhotoDraft.src)return alert('Escolha uma foto.');S.mealPhotos=S.mealPhotos||[];S.mealPhotos.push({...mealPhotoDraft,id:uid(),time:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});mealPhotoDraft=null;update()}
function photoEditor(){let p=mealPhotoDraft;return `<div class="card"><div class="trainhead"><h2>Foto da refeição</h2><button class="light" onclick="mealPhotoDraft=null;render()">Cancelar</button></div><label>Refeição<select onchange="mealPhotoDraft.type=this.value;mealPhotoDraft.planId=''">${mealTypes.map(t=>`<option ${p.type===t?'selected':''}>${t}</option>`).join('')}</select></label><label>Tirar foto<input type="file" accept="image/*" capture="environment" onchange="mealPhotoRead(this.files[0])"></label><label>Escolher da galeria<input type="file" accept="image/*" onchange="mealPhotoRead(this.files[0])"></label>${p.src?`<img class="photo" src="${esc(p.src)}">`:''}<label>Observação opcional<textarea onchange="mealPhotoDraft.notes=this.value">${esc(p.notes)}</textarea></label><button onclick="mealPhotoSave()">Salvar foto</button></div>`}
let oldNutrition=nutritionPage;nutritionPage=function(t){if(mealPhotoDraft)return photoEditor();return oldNutrition(t)};
function progressMarkup(){let names=[...new Set(histories().flatMap(a=>a.ex.filter(e=>e.sets.some(s=>s.done)).map(e=>e.name)))];return `<select id="progressSelect" onchange="progressChart(this.value)"><option value="">Escolha um exercício</option>${names.map(n=>`<option>${esc(n)}</option>`).join('')}</select><div id="progressChart"></div>`}
function progressChart(n){let rows=histories().flatMap(a=>a.ex.filter(e=>e.name===n&&e.sets.some(s=>s.done)).map(e=>({date:a.date,max:Math.max(...e.sets.filter(s=>s.done).map(s=>Number(s.load))),volume:e.sets.filter(s=>s.done).reduce((v,s)=>v+Number(s.load)*Number(s.reps),0)})));let max=Math.max(1,...rows.map(r=>r.max));$('progressChart').innerHTML=rows.map(r=>`<div class="line"><small>${esc(r.date)}</small><b>${r.max} kg · ${r.volume} kg volume</b></div>${bar(r.max,max)}`).join('')||'<p>Sem registros.</p>'}
let originalRender=render;render=function(){originalRender();let app=$('app');if(page==='sessao'){app.innerHTML=sessionPage();sessionTick();return}if(page==='resumo'){app.innerHTML='<h2>Ficha de desempenho</h2>'+reportMarkup(histories().at(-1))+'<div class="trainactions"><button onclick="go(\'cardio\')">Adicionar cardio</button><button class="light" onclick="go(\'evolucao\')">Ver evolução</button></div>';return}if(page==='inicio'){let w=S.workouts.find(w=>w.days.includes(new Date(today()+'T12:00:00').getDay()));let cards=[...app.querySelectorAll('.grid .card')];let c=cards.find(x=>x.textContent.includes('TREINO DO DIA'));if(c){c.innerHTML=`<small>TREINO DO DIA</small><h3>${esc(w?.name||'Sem ficha prevista')}</h3><p>${w?w.ex.length+' exercícios':'Organize suas fichas'}</p>${session?'<button onclick="page=\'sessao\';render()">Retomar sessão</button>':w?`<button onclick="startSession('${w.id}')">${S.logs[today()+'_'+w.id]?.finished?'Iniciar nova sessão':'Iniciar treino'}</button>`:'<button onclick="go(\'treino\')">Organizar treinos</button>'}`;}}if(page==='nutricao'&&!nd&&!mealPhotoDraft){let cards=[...app.querySelectorAll('.trainlayout section > .card')];cards.forEach((c,i)=>{let type=mealTypes[i];if(!type)return;let b=document.createElement('button');b.className='light';b.textContent='📷 Registrar foto';b.onclick=()=>mealPhotoOpen(type);c.append(b);let plans=S.plans.filter(x=>(!x.date||x.date===date)&&x.type===type);let rows=c.querySelectorAll('.draftrow');plans.forEach((p,j)=>{if(!rows[j])return;let btn=document.createElement('button');btn.className='light';btn.textContent='📷 Foto desta refeição';btn.onclick=()=>mealPhotoOpen(type,p.id);rows[j].append(btn)});for(let p of (S.mealPhotos||[]).filter(p=>p.date===date&&p.type===type)){let el=document.createElement('div');el.className='mealpic';el.innerHTML=`<details><summary><img src="${esc(p.src)}" alt="Foto da refeição"><span>${esc(p.time)} · ${esc(p.notes||'Registro visual')}</span></summary><img class="photo" src="${esc(p.src)}"><button class="danger" onclick="remove('mealPhotos','${p.id}')">Excluir foto</button></details>`;c.append(el)}})}if(page==='evolucao'){let wrap=app.querySelector('.sectiongrid');if(wrap){let cards=[...wrap.children];wrap.className='compactevo';let titles=['Histórico de peso','Peso e medidas','Fotos corporais','Cardio'];cards.forEach((c,i)=>{let d=document.createElement('details');d.className='card';let title=titles[i]||'Detalhes';d.innerHTML=`<summary>${title}</summary>`;if(evoOpen.has(title))d.open=true;d.ontoggle=()=>d.open?evoOpen.add(title):evoOpen.delete(title);c.replaceWith(d);d.append(c);c.classList.remove('card')});for(let [title,body] of [['Progressão de cargas',progressMarkup()],['Fichas de desempenho',histories().slice().reverse().map(a=>`<details><summary>${esc(a.date)} · ${esc(a.name)}</summary>${reportMarkup(a)}</details>`).join('')||'<p>Nenhuma sessão detalhada registrada.</p>']]){let d=document.createElement('details');d.className='card';d.innerHTML=`<summary>${title}</summary>${body}`;wrap.append(d)}}}};

render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></html>
